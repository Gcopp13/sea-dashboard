[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline"

[dev]
  port = 8888
  targetPort = 3000

[functions]
  node_bundler = "esbuild"

# Serve sw.js directly — must not be caught by the SPA redirect
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
