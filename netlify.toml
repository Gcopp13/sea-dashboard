[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline"

[dev]
  port = 8888
  targetPort = 3000

[functions]
  node_bundler = "esbuild"
  # esbuild inlines pdfkit's JS but not its runtime .afm font-metric data files.
  # At runtime the bundled code reads them from __dirname + '/data/*.afm', which
  # resolves to /var/task/netlify/functions/data/. Ship the vendored copies there
  # so send-daily-brief's PDF generation stops throwing ENOENT on Helvetica.afm.
  included_files = ["netlify/functions/data/*.afm"]

# Scheduled functions -- migrated off the external (Perplexity-chat) scheduler so
# these run on Netlify's own infrastructure. Times are UTC. Netlify triggers each
# function directly (no HTTP request), so handlers must not depend on the body.
[functions."evening-reminder"]
  schedule = "0 23 * * *"    # daily 23:00 UTC (7 PM EDT) - evening review push

[functions."re-engagement"]
  schedule = "0 13 * * *"    # daily 13:00 UTC (9 AM EDT) - re-engagement email

[functions."coach-nudge-push"]
  schedule = "17 * * * *"    # hourly at :17 - coach nudge push

[functions."weekly-ritual-reminder"]
  schedule = "0 12 * * 0"    # Sundays 12:00 UTC (8 AM EDT) - weekly ritual push

[functions."weekly-summary"]
  schedule = "0 12 * * 0"    # Sundays 12:00 UTC (8 AM EDT) - weekly summary email

[functions."cycle-heads-up"]
  schedule = "0 13 * * 1"    # Mondays 13:00 UTC (9 AM EDT) - 120-day final-week heads-up email

# Serve sw.js directly -- must not be caught by the SPA redirect
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
