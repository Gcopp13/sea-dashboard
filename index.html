  <script>
    const SUPABASE_URL = 'https://vilsfabrovxwgdrhkvso.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpbHNmYWJyb3Z4d2dkcmhrdnNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxMjIxMjgsImV4cCI6MjA4OTY5ODEyOH0.3GGxaTgxZHxn_hFOcwNyBs9XxridjeWEdM3a5lRPomU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: white; overscroll-behavior: none; }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
    .page-content { padding-bottom: 48px; }
    :root { --safe-bottom: env(safe-area-inset-bottom, 0px); --modal-bottom: max(24px, env(safe-area-inset-bottom, 24px)); --sheet-bottom: max(32px, calc(16px + env(safe-area-inset-bottom, 0px))); }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .content-scroll { position: fixed; top: 58px; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    input, textarea, select { font-size: 16px !important; }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes slideUp { 0% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes pulse-ring { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes confetti-fall { 0% { transform: translateY(-10px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    .pop-in { animation: popIn 0.3s ease-out; }
    .slide-up { animation: slideUp 0.3s ease-out; }
    .ring-pulse { animation: pulse-ring 2s ease-in-out infinite; }
    .confetti-piece { position: fixed; top: -20px; width: 10px; height: 10px; animation: confetti-fall 3s ease-in forwards; z-index: 9999; pointer-events: none; border-radius: 2px; }
    @media (max-width: 768px) {
      .coach-panel { position: fixed; bottom: 0; left: 0; right: 0; max-height: 85dvh; border-top-left-radius: 1.5rem; border-top-right-radius: 1.5rem; z-index: 60; transition: bottom 0.2s ease, max-height 0.2s ease; display: flex; flex-direction: column; }
      .coach-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 55; }
      .coach-input-bar { padding-bottom: max(1rem, env(safe-area-inset-bottom, 1rem)); flex-shrink: 0; }
      .coach-messages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    }
    @media (min-width: 769px) {
      .coach-panel { position: fixed; right: 0; top: 0; height: 100vh; width: 400px; border-left: 1px solid #334155; z-index: 60; }
    }
    @media print {
      /* Hide all chrome */
      .no-print, .no-print * { display: none !important; }

      /* Light mode for paper */
      body { background: white !important; color: #0f172a !important; margin: 0; padding: 0; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

      /* Remove sticky/fixed positioning */
      .sticky, [style*="position: fixed"], [style*="position:fixed"] { position: static !important; }
      .content-scroll { position: static !important; overflow: visible !important; height: auto !important; }

      /* Content area — full width, no bottom padding */
      .page-content { padding-bottom: 0 !important; }
      .max-w-2xl { max-width: 100% !important; margin: 0 !important; padding: 0 8px !important; }

      /* Print header */
      .print-header { display: block !important; }

      /* Cards readable on white */
      .bg-slate-800\/60, [class*="bg-slate-8"], [class*="bg-slate-7"] {
        background: #f8fafc !important;
        border-color: #e2e8f0 !important;
      }

      /* Text colors on white */
      .text-white { color: #0f172a !important; }
      .text-slate-400 { color: #64748b !important; }
      .text-slate-300 { color: #475569 !important; }
      .text-slate-500 { color: #94a3b8 !important; }

      /* Inputs readable */
      input, textarea { 
        background: #f1f5f9 !important; 
        border: 1px solid #cbd5e1 !important; 
        color: #0f172a !important;
        -webkit-text-fill-color: #0f172a !important;
      }

      /* Page breaks */
      .print-break { page-break-before: always; }

      /* Keep colors on badges/scores */
      [style*="color: #"] { }
    }
  </style>
</head>
<body>
<div id="root"></div>
<div class="print-header" style="display:none; padding: 16px 8px 8px; border-bottom: 2px solid #e2e8f0; margin-bottom: 16px;">
  <div style="display:flex; align-items:center; justify-content:space-between;">
    <div>
      <h1 style="font-size:20px; font-weight:900; color:#0f172a; margin:0;">S.E.A. Dashboard</h1>
      <p style="font-size:11px; color:#64748b; margin:2px 0 0;">Getting Results Inc. · Printed <span id="print-date"></span></p>
    </div>
    <div style="font-size:11px; color:#64748b; text-align:right;">
      <p style="margin:0;">Strategic · Executable · Accountable</p>
    </div>
  </div>
</div>
<script>document.getElementById('print-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});</script>
<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  // ── Coach API ──────────────────────────────────────────────────────────────
  const COACH_API = '/.netlify/functions/coach';

  // ── Auth: Login Screen ─────────────────────────────────────────────────────
  // ── Shared auth styles ──────────────────────────────────────────────────
  const authInputStyle = {
    width: '100%', boxSizing: 'border-box',
    background: 'rgba(15,18,41,0.8)',
    border: '1px solid rgba(71,85,105,0.8)',
    borderRadius: '12px', padding: '14px 16px',
    color: '#fff', fontSize: '16px',
    outline: 'none', marginBottom: '14px',
  };
  const authBtnStyle = (loading) => ({
    width: '100%', padding: '14px',
    background: loading ? '#334155' : 'linear-gradient(135deg,#3b82f6,#8b5cf6)',
    border: 'none', borderRadius: '12px',
    color: '#fff', fontSize: '1rem', fontWeight: '700',
    cursor: loading ? 'not-allowed' : 'pointer',
  });
  const AuthCard = ({ children }) => (
    <div style={{
      minHeight: '100vh', background: '#0f1229',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      padding: '24px', fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    }}>
      <div style={{ textAlign: 'center', marginBottom: '32px' }}>
        <div style={{ fontSize: '48px', marginBottom: '12px' }}>🌊</div>
        <h1 style={{
          fontSize: '2rem', fontWeight: '900', margin: '0 0 6px',
          background: 'linear-gradient(135deg,#60a5fa,#a78bfa)',
          WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent'
        }}>S.E.A. Dashboard</h1>
        <p style={{ color: '#94a3b8', fontSize: '0.85rem', margin: 0, fontStyle: 'italic' }}>Live By Design, Not By Default</p>
      </div>
      <div style={{
        width: '100%', maxWidth: '400px',
        background: 'rgba(30,41,59,0.8)',
        border: '1px solid rgba(51,65,85,0.8)',
        borderRadius: '24px', padding: '32px'
      }}>{children}</div>
      <p style={{ color: '#475569', fontSize: '0.75rem', marginTop: '20px', textAlign: 'center' }}>
        By signing in, you agree to our terms of service.
      </p>
    </div>
  );

  // ── Login Screen — email + password ─────────────────────────────────────
  const LoginScreen = ({ onShowForgot, onShowMagicLink }) => {
    const [email, setEmail]       = useState('');
    const [password, setPassword] = useState('');
    const [errorMsg, setErrorMsg] = useState('');
    const [loading, setLoading]   = useState(false);

    const handleLogin = async (e) => {
      e.preventDefault();
      if (!email.trim() || !password) return;
      setLoading(true); setErrorMsg('');
      try {
        const { error } = await _supabase.auth.signInWithPassword({
          email: email.trim(), password
        });
        if (error) setErrorMsg(error.message);
        // on success onAuthStateChange fires automatically
      } catch(err) {
        setErrorMsg('Something went wrong. Please try again.');
      } finally { setLoading(false); }
    };

    return (
      <AuthCard>
        <h2 style={{ color: '#fff', fontSize: '1.2rem', fontWeight: '700', margin: '0 0 6px' }}>Welcome back</h2>
        <p style={{ color: '#94a3b8', fontSize: '0.85rem', margin: '0 0 22px' }}>Sign in to your account</p>
        <form onSubmit={handleLogin}>
          <input type="email" placeholder="Email address" value={email}
            onChange={e => setEmail(e.target.value)} required style={authInputStyle}/>
          <input type="password" placeholder="Password" value={password}
            onChange={e => setPassword(e.target.value)} required style={authInputStyle}/>
          {errorMsg && <p style={{ color: '#f87171', fontSize: '0.82rem', margin: '-6px 0 10px' }}>{errorMsg}</p>}
          <button type="submit" disabled={loading} style={authBtnStyle(loading)}>
            {loading ? 'Signing in…' : 'Sign In'}
          </button>
        </form>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '16px' }}>
          <button onClick={onShowForgot}
            style={{ background: 'none', border: 'none', color: '#60a5fa', fontSize: '0.82rem', cursor: 'pointer', padding: 0 }}>
            Forgot password?
          </button>
          <button onClick={onShowMagicLink}
            style={{ background: 'none', border: 'none', color: '#94a3b8', fontSize: '0.82rem', cursor: 'pointer', padding: 0 }}>
            New user? Sign up →
          </button>
        </div>
      </AuthCard>
    );
  };

  // ── Magic Link Screen — for new users / sign up ──────────────────────────
  const MagicLinkScreen = ({ onBack }) => {
    const [email, setEmail]     = useState('');
    const [status, setStatus]   = useState(null);
    const [errorMsg, setErrorMsg] = useState('');
    const [loading, setLoading] = useState(false);

    const handleSubmit = async (e) => {
      e.preventDefault();
      if (!email.trim()) return;
      setLoading(true); setStatus(null);
      try {
        const { error } = await _supabase.auth.signInWithOtp({
          email: email.trim(),
          options: { emailRedirectTo: `${window.location.origin}?set_password=1` }
        });
        if (error) { setErrorMsg(error.message); setStatus('error'); }
        else setStatus('sent');
      } catch(err) {
        setErrorMsg('Something went wrong. Please try again.');
        setStatus('error');
      } finally { setLoading(false); }
    };

    return (
      <AuthCard>
        <button onClick={onBack}
          style={{ background: 'none', border: 'none', color: '#60a5fa', fontSize: '0.85rem', cursor: 'pointer', padding: '0 0 16px', display: 'block' }}>
          ← Back to sign in
        </button>
        <h2 style={{ color: '#fff', fontSize: '1.2rem', fontWeight: '700', margin: '0 0 6px' }}>Create your account</h2>
        <p style={{ color: '#94a3b8', fontSize: '0.85rem', margin: '0 0 22px', lineHeight: 1.5 }}>
          Enter your email and we'll send you a link to get started. You'll set a password after your first login.
        </p>
        {status === 'sent' ? (
          <div style={{ background: 'rgba(16,185,129,0.12)', border: '1px solid rgba(16,185,129,0.3)', borderRadius: '12px', padding: '16px', textAlign: 'center', color: '#34d399' }}>
            <div style={{ fontSize: '24px', marginBottom: '8px' }}>✉️</div>
            <p style={{ fontWeight: '700', margin: '0 0 4px' }}>Check your email!</p>
            <p style={{ fontSize: '0.8rem', margin: 0, color: '#6ee7b7' }}>We sent a link to <strong>{email}</strong></p>
          </div>
        ) : (
          <form onSubmit={handleSubmit}>
            <input type="email" placeholder="your@email.com" value={email}
              onChange={e => setEmail(e.target.value)} required style={authInputStyle}/>
            {status === 'error' && <p style={{ color: '#f87171', fontSize: '0.82rem', margin: '-6px 0 10px' }}>{errorMsg}</p>}
            <button type="submit" disabled={loading} style={authBtnStyle(loading)}>
              {loading ? 'Sending…' : 'Send Sign-Up Link'}
            </button>
          </form>
        )}
      </AuthCard>
    );
  };

  // ── Forgot Password Screen ────────────────────────────────────────────────
  const ForgotPasswordScreen = ({ onBack }) => {
    const [email, setEmail]     = useState('');
    const [status, setStatus]   = useState(null);
    const [errorMsg, setErrorMsg] = useState('');
    const [loading, setLoading] = useState(false);

    const handleSubmit = async (e) => {
      e.preventDefault();
      if (!email.trim()) return;
      setLoading(true); setStatus(null);
      try {
        const res = await fetch('/.netlify/functions/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email.trim() }),
        });
        const data = await res.json();
        if (!res.ok || data.error) { setErrorMsg(data.error || 'Something went wrong.'); setStatus('error'); }
        else setStatus('sent');
      } catch(err) {
        setErrorMsg('Something went wrong. Please try again.');
        setStatus('error');
      } finally { setLoading(false); }
    };

    return (
      <AuthCard>
        <button onClick={onBack}
          style={{ background: 'none', border: 'none', color: '#60a5fa', fontSize: '0.85rem', cursor: 'pointer', padding: '0 0 16px', display: 'block' }}>
          ← Back to sign in
        </button>
        <h2 style={{ color: '#fff', fontSize: '1.2rem', fontWeight: '700', margin: '0 0 6px' }}>Reset your password</h2>
        <p style={{ color: '#94a3b8', fontSize: '0.85rem', margin: '0 0 22px' }}>Enter your email and we'll send a reset link.</p>
        {status === 'sent' ? (
          <div style={{ background: 'rgba(16,185,129,0.12)', border: '1px solid rgba(16,185,129,0.3)', borderRadius: '12px', padding: '16px', textAlign: 'center', color: '#34d399' }}>
            <div style={{ fontSize: '24px', marginBottom: '8px' }}>✉️</div>
            <p style={{ fontWeight: '700', margin: '0 0 4px' }}>Check your email!</p>
            <p style={{ fontSize: '0.8rem', margin: 0, color: '#6ee7b7' }}>We sent a reset link to <strong>{email}</strong></p>
          </div>
        ) : (
          <form onSubmit={handleSubmit}>
            <input type="email" placeholder="your@email.com" value={email}
              onChange={e => setEmail(e.target.value)} required style={authInputStyle}/>
            {status === 'error' && <p style={{ color: '#f87171', fontSize: '0.82rem', margin: '-6px 0 10px' }}>{errorMsg}</p>}
            <button type="submit" disabled={loading} style={authBtnStyle(loading)}>
              {loading ? 'Sending…' : 'Send Reset Link'}
            </button>
          </form>
        )}
      </AuthCard>
    );
  };

  // ── Set Password Screen — shown after magic link / reset ─────────────────
  const SetPasswordScreen = ({ isReset = false, onDone }) => {
    const [password, setPassword]     = useState('');
    const [confirm, setConfirm]       = useState('');
    const [errorMsg, setErrorMsg]     = useState('');
    const [loading, setLoading]       = useState(false);
    const [success, setSuccess]       = useState(false);

    const handleSubmit = async (e) => {
      e.preventDefault();
      if (password.length < 8) { setErrorMsg('Password must be at least 8 characters.'); return; }
      if (password !== confirm) { setErrorMsg('Passwords do not match.'); return; }
      setLoading(true); setErrorMsg('');
      try {
        const { error } = await _supabase.auth.updateUser({ password });
        if (error) { setErrorMsg(error.message); setLoading(false); return; }
        setSuccess(true);
        // Fire welcome email for new users (not resets)
        if (!isReset) {
          try {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) {
              fetch('/.netlify/functions/welcome-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user.email, name: user.user_metadata?.full_name || user.email.split('@')[0] })
              }).catch(() => {});
            }
          } catch(err) { /* welcome email failure is non-fatal */ }
        }
        setTimeout(() => { if (onDone) onDone(); }, 1500);
      } catch(err) {
        setErrorMsg('Something went wrong. Please try again.');
        setLoading(false);
      }
    };

    return (
      <AuthCard>
        <h2 style={{ color: '#fff', fontSize: '1.2rem', fontWeight: '700', margin: '0 0 6px' }}>
          {isReset ? 'Set a new password' : 'Create your password'}
        </h2>
        <p style={{ color: '#94a3b8', fontSize: '0.85rem', margin: '0 0 22px', lineHeight: 1.5 }}>
          {isReset
            ? 'Choose a new password for your account.'
            : 'Set a password so you can sign in easily next time.'}
        </p>
        {success ? (
          <div style={{ background: 'rgba(16,185,129,0.12)', border: '1px solid rgba(16,185,129,0.3)', borderRadius: '12px', padding: '16px', textAlign: 'center', color: '#34d399' }}>
            <div style={{ fontSize: '24px', marginBottom: '8px' }}>✅</div>
            <p style={{ fontWeight: '700', margin: 0 }}>Password set! Taking you in…</p>
          </div>
        ) : (
          <form onSubmit={handleSubmit}>
            <input type="password" placeholder="New password (min 8 chars)" value={password}
              onChange={e => setPassword(e.target.value)} required style={authInputStyle}/>
            <input type="password" placeholder="Confirm password" value={confirm}
              onChange={e => setConfirm(e.target.value)} required style={authInputStyle}/>
            {errorMsg && <p style={{ color: '#f87171', fontSize: '0.82rem', margin: '-6px 0 10px' }}>{errorMsg}</p>}
            <button type="submit" disabled={loading} style={authBtnStyle(loading)}>
              {loading ? 'Saving…' : isReset ? 'Set New Password' : 'Set Password & Enter Dashboard'}
            </button>
          </form>
        )}
      </AuthCard>
    );
  };

  // ── Auth Router — handles all auth states + URL tokens ───────────────────
  const AuthRouter = ({ needsPasswordReset = false, onResetDone = () => {}, needsSetPassword = false, onSetPasswordDone = () => {}, startOnSignup = false }) => {
    // Read ALL URL params synchronously before anything else — params may be gone after first render
    const getInitialScreen = () => {
      // Parent-driven states take priority
      if (needsPasswordReset) return 'reset-password';
      if (needsSetPassword)   return 'set-password';
      if (startOnSignup)      return 'magic';

      const hash = window.location.hash;

      // Implicit flow: password recovery hash
      if (hash.includes('type=recovery')) return 'reset-password';

      // Magic link login hash (non-recovery) — show set-password for new users
      if (hash.includes('access_token') && !hash.includes('type=recovery')) {
        window.history.replaceState({}, '', window.location.pathname);
        return 'set-password';
      }

      return 'login';
    };

    const [screen, setScreen] = useState(getInitialScreen);

    // React to parent-driven state changes (PASSWORD_RECOVERY event, set-password after invite)
    useEffect(() => {
      if (needsPasswordReset) { setScreen('reset-password'); return; }
      if (needsSetPassword)   { setScreen('set-password');   return; }
    }, [needsPasswordReset, needsSetPassword]);

    if (screen === 'magic')          return <MagicLinkScreen onBack={() => setScreen('login')} />;
    if (screen === 'forgot')         return <ForgotPasswordScreen onBack={() => setScreen('login')} />;
    if (screen === 'set-password')   return <SetPasswordScreen isReset={false} onDone={() => { onSetPasswordDone(); setScreen('login'); }} />;
    if (screen === 'reset-password') return <SetPasswordScreen isReset={true}  onDone={() => { onResetDone(); setScreen('login'); }} />;
    return <LoginScreen onShowForgot={() => setScreen('forgot')} onShowMagicLink={() => setScreen('magic')} />;
  };

  const getOrCreateAdvisorId = () => {
    let id = localStorage.getItem('sea_advisor_id');
    if (!id) {
      const arr = new Uint8Array(8);
      crypto.getRandomValues(arr);
      id = 'adv_' + Array.from(arr).map(b=>b.toString(16).padStart(2,'0')).join('');
      localStorage.setItem('sea_advisor_id', id);
    }
    return id;
  };

  // ── Icons ──────────────────────────────────────────────────────────────────
  const Icon = ({ d, size = 22, stroke = 2, fill = "none" }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">
      {Array.isArray(d) ? d.map((p, i) => <path key={i} d={p}/>) : <path d={d}/>}
    </svg>
  );
  const CoachTabIcon = () => <span style={{fontSize:'18px'}}>⚓</span>;
  const SunIcon    = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
  const CalIcon    = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
  const StarIcon   = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;

  // ── Wheel Radar (mini) ─────────────────────────────────────────────────────
  const MiniRadar = ({ scores, prevScores = null, size = 180 }) => {
    const cx = size/2, cy = size/2, maxR = size*0.36;
    const toRad = d => d*Math.PI/180;
    const cats = [
      {key:'family',  label:'Family',  color:'#f43f5e', angle:-90},
      {key:'fun',     label:'Fun',     color:'#f59e0b', angle:-18},
      {key:'fitness', label:'Fitness', color:'#10b981', angle:54},
      {key:'finance', label:'Finance', color:'#3b82f6', angle:126},
      {key:'faith',   label:'Faith',   color:'#a855f7', angle:198}
    ];
    const pt = (angle,val) => ({ x: cx+(val/10)*maxR*Math.cos(toRad(angle)), y: cy+(val/10)*maxR*Math.sin(toRad(angle)) });
    const poly = pts => pts.map(p=>`${p.x},${p.y}`).join(' ');
    const grid = v => cats.map(c=>pt(c.angle,v));
    const scorePts = cats.map(c=>pt(c.angle,scores[c.key]||0));
    const prevPts = prevScores ? cats.map(c=>pt(c.angle,prevScores[c.key]||0)) : null;
    const labelPt = (angle) => {
      const dist = maxR * 1.28;
      return { x: cx+dist*Math.cos(toRad(angle)), y: cy+dist*Math.sin(toRad(angle)) };
    };
    // For full spider chart — draw individual colored fills per segment
    const segmentPath = (i) => {
      const c = cats[i];
      const next = cats[(i+1)%cats.length];
      const p1 = pt(c.angle, scores[c.key]||0);
      const p2 = pt(next.angle, scores[next.key]||0);
      return `M ${cx},${cy} L ${p1.x},${p1.y} L ${p2.x},${p2.y} Z`;
    };
    return (
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{overflow:'visible'}}>
        {/* Grid rings */}
        {[2,4,6,8,10].map(v=>(
          <polygon key={v} points={poly(grid(v))} fill="none" stroke={v===10?'#334155':'#1e293b'} strokeWidth={v===10?1.5:0.8}/>
        ))}
        {/* Grid value labels */}
        {[2,4,6,8,10].map(v=>{
          const p=pt(-90,v);
          return <text key={v} x={cx+5} y={p.y+4} fill="#475569" fontSize={size*0.055} fontWeight="500">{v}</text>;
        })}
        {/* Spokes */}
        {cats.map(c=>{const e=pt(c.angle,10);return<line key={c.key} x1={cx} y1={cy} x2={e.x} y2={e.y} stroke="#1e293b" strokeWidth="1.5"/>;} )}
        {/* Colored segment fills */}
        {cats.map((c,i)=>(
          <path key={c.key} d={segmentPath(i)} fill={c.color} opacity="0.18"/>
        ))}
        {/* Previous week polygon */}
        {prevPts && <polygon points={poly(prevPts)} fill="none" stroke="rgba(148,163,184,0.35)" strokeWidth="1.5" strokeDasharray="4,3"/>}
        {/* Current score outline */}
        <polygon points={poly(scorePts)} fill="rgba(99,102,241,0.08)" stroke="#6366f1" strokeWidth="2"/>
        {/* Score dots */}
        {scorePts.map((p,i)=>(
          <g key={i}>
            <circle cx={p.x} cy={p.y} r={size*0.042} fill={cats[i].color} stroke="#0f172a" strokeWidth="2"/>
            <text x={p.x} y={p.y+size*0.015} textAnchor="middle" fill="white" fontSize={size*0.07} fontWeight="700" dominantBaseline="middle">{scores[cats[i].key]||0}</text>
          </g>
        ))}
        {/* Category labels */}
        {cats.map((c)=>{
          const lp=labelPt(c.angle);
          const anchor = lp.x < cx-5 ? 'end' : lp.x > cx+5 ? 'start' : 'middle';
          return(
            <text key={c.key} x={lp.x} y={lp.y+4} textAnchor={anchor} fill={c.color} fontSize={size*0.075} fontWeight="700">{c.label}</text>
          );
        })}
      </svg>
    );

  // ── SCORING ENGINE ─────────────────────────────────────────────────────────
  const calcSEAScore = (data, weekIdx) => {
    const week = data.weeks[weekIdx];
    // 1. Habit completion (30pts) — respects each habit's targetDays
    const acts = (week.aActivities||[]).filter(a=>a.name&&a.name.trim());
    const habitPct = acts.length > 0
      ? acts.reduce((s,a) => {
          const target = Math.min(Math.max(parseInt(a.targetDays)||7, 1), 7);
          const done = (a.days||[]).filter(Boolean).length;
          return s + Math.min(done / target, 1); // cap at 100% per habit
        }, 0) / acts.length
      : 0;
    const habitScore = habitPct * 30;
    // 2. Anvil streak (25pts) — based on hitting frequency target per period
    const log = data.anvilProject?.log || [];
    const freqCount  = Math.max(1, parseInt(data.anvilProject?.freqCount)  || 1);
    const freqPeriod = data.anvilProject?.freqPeriod || 'week'; // 'week' | 'biweekly' | 'month'
    // Helper: get start of period N steps back from today
    const getPeriodStart = (stepsBack) => {
      const d = new Date(); d.setHours(0,0,0,0);
      if (freqPeriod === 'week') {
        const day = d.getDay(); const monday = new Date(d); monday.setDate(d.getDate() - ((day+6)%7) - (stepsBack*7)); return monday;
      } else if (freqPeriod === 'biweekly') {
        const day = d.getDay(); const monday = new Date(d); monday.setDate(d.getDate() - ((day+6)%7) - (stepsBack*14)); return monday;
      } else { // month
        const m = new Date(d.getFullYear(), d.getMonth() - stepsBack, 1); return m;
      }
    };
    const getPeriodEnd = (stepsBack) => {
      const start = getPeriodStart(stepsBack - 1);
      const end = new Date(start); end.setDate(end.getDate() - 1); return end;
    };
    // Count log entries in a given period
    const logsInPeriod = (start, end) => log.filter(e => { const d = new Date(e.date); d.setHours(0,0,0,0); return d >= start && d <= end; }).length;
    // Current period: did they hit it?
    const curStart = getPeriodStart(0);
    const today2 = new Date(); today2.setHours(23,59,59,999);
    const currentLogs = logsInPeriod(curStart, today2);
    const hitCurrent = currentLogs >= freqCount;
    // Partial credit: logs done vs target (regardless of day of week)
    const currentPct = Math.min(currentLogs / freqCount, 1);
    // Count consecutive periods hit (streak)
    let streak = hitCurrent ? 1 : 0;
    if (hitCurrent) {
      for (let i = 1; i <= 52; i++) {
        const s = getPeriodStart(i);
        const e = getPeriodEnd(i);
        if (logsInPeriod(s, e) >= freqCount) streak++; else break;
      }
    }
    // Score: partial credit = logs / target × 25 pts
    const anvilScore = currentPct * 25;
    // 3. Wheel avg (20pts)
    const w = week.wheelOfJohn||{family:5,fun:5,fitness:5,finance:5,faith:5};
    const wheelAvg = Object.values(w).reduce((a,b)=>a+(b||5),0)/5;
    const wheelScore = (wheelAvg/10)*20;
    // 4. Weekly ritual (15pts)
    const ritualDone = week.wins.some(x=>x.trim()) && week.focus && week.focus.trim() && week.goalPriorities.some(x=>x.trim());
    const ritualScore = ritualDone ? 15 : 0;
    // 5. Goal progress (10pts)
    const goals = data.goals.filter(g=>g.title&&g.title.trim());
    const goalAvg = goals.length > 0 ? goals.reduce((s,g)=>s+(g.completion||0),0)/goals.length : 0;
    const goalScore = (goalAvg/100)*10;
    const total = Math.round(habitScore+anvilScore+wheelScore+ritualScore+goalScore);
    return { total, stars: total>=80?5:total>=60?4:total>=40?3:total>=20?2:1, habitPct:Math.round(habitPct*100), anvilStreak:streak, anvilScore:Math.round(anvilScore), anvilLogs:currentLogs, anvilTarget:freqCount, wheelAvg:wheelAvg.toFixed(1), ritualDone, goalAvg:Math.round(goalAvg) };
  };

  // buildSystemPrompt — extracted so both AICoach and the smart trigger can use it
  const buildCoachSystemPrompt = (plannerData, personality, currentContext) => {
      const p = personality || {style:2,tone:2,approach:2,energy:2};
      const styleLabel = p.style<=1?'a hands-on coach who pushes for action':p.style>=3?'a strategic advisor who informs and guides':'a coaching advisor who balances pushing with guidance';
      const toneLabel = p.tone<=1?'deeply empathetic and emotionally warm — acknowledge feelings first':p.tone>=3?'direct and no-nonsense — skip the fluff, get to the point':'warm but direct — brief acknowledgment then straight to substance';
      const approachLabel = p.approach<=1?'supportive and accepting — meet them where they are, celebrate progress':'high-standards and challenging — push hard, expect more, call out excuses';
      const energyLabel = p.energy<=1?'calm and measured — steady, thoughtful, no hype':p.energy>=3?'fired up and intense — high energy, urgent, motivational':'steady with clear urgency — focused energy, no wasted words';
      const personalitySummary = `COACH PERSONALITY (user-configured):\n- Style: Act as ${styleLabel}\n- Tone: Be ${toneLabel}\n- Approach: Be ${approachLabel}\n- Energy: Be ${energyLabel}`;

      const weeksWithData = (plannerData.weeks||[]).filter(w=>w.wins?.some(x=>x.trim())||w.focus?.trim());
      const latestWeek = weeksWithData.length > 0 ? weeksWithData[weeksWithData.length-1] : null;
      // For habits, use the most recent week that actually has habit data (may differ from latestWeek)
      const latestHabitWeek = [...(plannerData.weeks||[])].reverse().find(w=>(w.aActivities||[]).some(a=>a.name?.trim())) || latestWeek;
      const recentWins = latestWeek?.wins?.filter(x=>x.trim()).join(', ') || 'None logged';
      const recentFocus = latestWeek?.focus || 'Not set';
      const anvilStreak = (()=>{
        const log = plannerData.anvilProject?.log||[];
        if(!log.length) return 0;
        const now=new Date();now.setHours(0,0,0,0);
        const unique=[...new Set(log.map(e=>{const d=new Date(e.date);d.setHours(0,0,0,0);return d.toDateString()}))].map(s=>new Date(s)).sort((a,b)=>b-a);
        let streak=0;
        for(let i=0;i<unique.length;i++){const exp=new Date(now);exp.setDate(now.getDate()-i);if(unique[i].toDateString()===exp.toDateString())streak++;else break;}
        return streak;

      const weeksIn = weeksWithData.length;

nces max\n- Summarize at end of session: "Quick recap:" then 2-3 sharp bullets\n- Use these naturally: "Love that", "Got it", "Totally fair", "Let's get practical", "That's gold"\n\nACCOUNTABILITY: Call out avoidance. Name slipping habits. Follow up on commitments. Never let them off the hook.\n\nRESPONSE RULES: 2-4 sentences max. One powerful question per response. Match personality settings precisely.\nDONT: Give financial advice. Make decisions for them. Be a cheerleader without substance. Ask questions you already know the answer to from SESSION MEMORY. Give long monologues.`;

  // Smart app-open trigger — reads full state, calls AI to decide if there's something worth saying
  const runSmartTrigger = async (plannerData, personality, authUserId) => {
    const triggerKey = 'smart-trigger-' + new Date().toDateString() + '-' + new Date().getHours();
    if (localStorage.getItem(triggerKey)) return null;

    // Build a compact dashboard snapshot for the trigger decision
    const anvilLog = plannerData.anvilProject?.log||[];
    const today = new Date(); today.setHours(0,0,0,0);
    const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
    const anvilToday = anvilLog.some(e=>new Date(e.date).toDateString()===today.toDateString());
    const anvilYesterday = anvilLog.some(e=>new Date(e.date).toDateString()===yesterday.toDateString());

    // Compute streak — start from yesterday if no log yet today (avoids false "streak broke" at early morning)
    const unique=[...new Set(anvilLog.map(e=>{const d=new Date(e.date);d.setHours(0,0,0,0);return d.toDateString()}))].map(s=>new Date(s)).sort((a,b)=>b-a);
    const streakBase = anvilToday ? today : yesterday;
    let anvilStreak=0;for(let i=0;i<unique.length;i++){const exp=new Date(streakBase);exp.setDate(streakBase.getDate()-i);if(unique[i].toDateString()===exp.toDateString())anvilStreak++;else break;}

    const weeksWithData = (plannerData.weeks||[]).filter(w=>w.wins?.some(x=>x.trim())||w.focus?.trim());
    const latestWeek = weeksWithData[weeksWithData.length-1];
    // For habits snapshot, use the most recent week with actual habit data (not just wins/focus)
    const latestHabitWeek = [...(plannerData.weeks||[])].reverse().find(w=>(w.aActivities||[]).some(a=>a.name?.trim())) || latestWeek;
    const habits = (latestHabitWeek?.aActivities||[]).filter(a=>a.name?.trim()).map(a=>({name:a.name,days:(a.days||[]).filter(Boolean).length,target:a.targetDays||7}));
    const goals = (plannerData.goals||[]).filter(g=>g.title?.trim()).map(g=>({title:g.title,pct:g.completion||0}));

    // Stuck habits (under half target for 2+ weeks)
    const recentWeeks = (plannerData.weeks||[]).slice(-4);
    const habitIssues = {};
    recentWeeks.forEach(w=>(w.aActivities||[]).forEach(a=>{
      if(!a.name?.trim()) return;
      const target = a.targetDays||7;
      const done = (a.days||[]).filter(Boolean).length;
      if(done < target/2) habitIssues[a.name]=(habitIssues[a.name]||0)+1;
    }));
    const stuckHabits = Object.entries(habitIssues).filter(([,c])=>c>=2).map(([n])=>n);

    const lastCommitment = localStorage.getItem('coach-commitment');
    const lastCommitmentDate = localStorage.getItem('coach-commitment-date');
    const todayStr = new Date().toISOString().split('T')[0];
    const yesterdayStr = new Date(Date.now()-86400000).toISOString().split('T')[0];

    const wheelScores = (()=>{
      const w=[...(plannerData.weeks||[])].reverse().find(wk=>wk.wheelOfJohn&&Object.values(wk.wheelOfJohn).some(v=>v!==5));
      return w?Object.entries(w.wheelOfJohn).map(([k,v])=>`${k}:${v}`).join(', '):'Not scored';
    })();

    const snapshot = {
      anvilProject: plannerData.anvilProject?.project||'Not set',
      anvilStreak,
      anvilToday,
      anvilYesterday,
      habits,
      stuckHabits,
      goals,
      weeklyRitual: latestWeek ? { focus: latestWeek.focus, hasWins: latestWeek.wins?.some(x=>x.trim()) } : null,
      wheelScores,
      lastCommitment: lastCommitment ? `"${lastCommitment}" on ${lastCommitmentDate}` : null,
      commitmentFollowUpDue: lastCommitment && (lastCommitmentDate===yesterdayStr || lastCommitmentDate===todayStr),
      weeksInCycle: weeksWithData.length,
      setupComplete: !!(plannerData.slightEdge?.trim() && plannerData.vision120Day?.trim() && goals.length > 0),
    };

    const decisionPrompt = `You are an AI coach reviewing a user's dashboard data when they open the app. Your job: decide if there is something GENUINELY worth noting right now — something specific, data-backed, and actionable. Not generic encouragement.

DASHBOARD SNAPSHOT:
${JSON.stringify(snapshot, null, 2)}

CRITICAL — TWO COMPLETELY SEPARATE SYSTEMS, DO NOT CONFUSE THEM:
1. ANVIL PROJECT: A single focused deep-work project (anvilProject field). anvilStreak = consecutive days they logged an Anvil session. anvilToday/anvilYesterday = whether they logged a session.
2. HABITS: Daily habits tracked in the habit tracker (habits array). Each habit has its own name, days completed this week, and weekly target. These are entirely independent from the Anvil project — even if a habit has the same name as the Anvil project, they are different things.
NEVER mix Anvil streak data with habit completion data. If you mention a habit, only reference that habit's own days/target numbers. If you mention Anvil, only reference anvilStreak/anvilToday.

RULES:
- Only speak up if there is a real pattern, gap, streak, or follow-up commitment worth addressing
- Do NOT speak up just to say hello or be encouraging in a generic way
- Do NOT speak up if everything looks consistent and there's nothing specific to say
- DO speak up for: broken Anvil streaks, outstanding commitments to follow up, stuck habits (2+ weeks under target), goal stagnation, missing weekly ritual, strong streaks worth acknowledging, Wheel of Life drops
- If a habit is on track (days >= target or close), do NOT flag it as a problem

Respond with JSON only: { "shouldTrigger": true/false, "message": "...", "label": "...", "emoji": "..." }
If shouldTrigger is false, message/label/emoji can be empty strings.
Message should be 1-2 sentences, direct, specific to their data. No generic fluff.
Label should clearly describe what is being coached (e.g. "Anvil Streak", "Meditation Habit", "Goal Check-in") — never just reuse the Anvil project name for habit coaching.`;

    try {
      const res = await fetch('/.netlify/functions/ai-coach', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({

          maxTokens: 200,

      const parsed = JSON.parse(jsonMatch[0]);

      return { content: parsed.message, _label: parsed.label || 'AI Coach', _emoji: parsed.emoji || '🤖' };

  const AICoach = ({ isOpen, onClose, plannerData, authUserId, personality, conversations, onConversationsChange, activeConvId, onActiveConvIdChange }) => {

        panel.style.height = vvh + 'px';

    const saveTimer = useRef(null);
    const inputRef = useRef(null);

    useEffect(() => {
      if (view === 'chat') {
        setTimeout(() => endRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
      }
    }, [messages, view]);

    const openNew = () => {
      setMessages([]);
      setConvId(null);
      setActiveConv(null);
      setView('chat');
    };

    const openExisting = (conv) => {
      setMessages(conv.messages || []);
      setConvId(conv.id);
      setActiveConv(conv);
      setView('chat');
    };

    const handleDelete = async (id, e) => {
      e.stopPropagation();
      if (!confirm('Delete this conversation?')) return;
      await deleteConversation(authUserId, id);
      const updated = await loadConversations(authUserId);
      if (onConversationsChange) onConversationsChange(updated);
    };

    const buildApiMessages = (allMessages, newMsg) => {
      const combined = [...allMessages, newMsg].filter(m=>m.role==='user'||m.role==='assistant');
      const trimmed = combined.slice(-12);
      const firstUserIdx = trimmed.findIndex(m=>m.role==='user');
      const valid = firstUserIdx >= 0 ? trimmed.slice(firstUserIdx) : trimmed;
      return valid.map(({role,content})=>({role,content}));
    };

    const send = async () => {
      if (!input.trim()) return;
      const userMsg = { role:'user', content: input };
      const commitmentMatch = input.match(/\b(i will|i'll|i am going to|i'm going to|i plan to|i commit to)\b(.{5,80})/i);
      if (commitmentMatch) {
        localStorage.setItem('coach-commitment', commitmentMatch[0].trim());
        localStorage.setItem('coach-commitment-date', new Date().toISOString().split('T')[0]);
      }
      const newMessages = [...messages, userMsg];
      setMessages(newMessages);
      setInput(''); setLoading(true);
      try {
        const res = await fetch('/.netlify/functions/ai-coach', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            systemPrompt: buildCoachSystemPrompt(plannerData, personality, null),
            maxTokens: 1024,
            messages: buildApiMessages(messages, userMsg)
          })
        });
        if (!res.ok) throw new Error(`${res.status} - ${await res.text()}`);
        const d = await res.json();
        if (d.content?.[0]) {
          const withReply = [...newMessages, {role:'assistant', content: d.content[0].text}];
          setMessages(withReply);
          clearTimeout(saveTimer.current);
          saveTimer.current = setTimeout(async () => {
            setSaving(true);
            const firstUser = withReply.find(m=>m.role==='user');
            const titleHint = firstUser ? firstUser.content.slice(0,60) : 'Coaching Session';
            const newId = await saveConversation(authUserId, convId, withReply, titleHint);
            if (newId && newId !== convId) setConvId(newId);
            const updated = await loadConversations(authUserId);
            if (onConversationsChange) onConversationsChange(updated);
            setSaving(false);
          }, 1500);
        }
      } catch(e) { alert('Coach error: ' + e.message); }
      finally { setLoading(false); }
    };

    // Group conversations by date
    const grouped = (() => {
      const groups = {};
      (conversations||[]).forEach(c => {
        const d = new Date(c.created_at);
        const label = (() => {
          const now = new Date();
          const diff = Math.floor((now - d) / 86400000);
          if (diff === 0) return 'Today';
          if (diff === 1) return 'Yesterday';
          if (diff < 7) return d.toLocaleDateString('en-US',{weekday:'long'});
          return d.toLocaleDateString('en-US',{month:'long',day:'numeric'});
        })();
        if (!groups[label]) groups[label] = [];
        groups[label].push(c);
      });
      return groups;
    })();

    const getPreview = (conv) => {
      const msgs = conv.messages || [];
      const last = [...msgs].reverse().find(m => m.role === 'assistant');
      return last ? last.content.slice(0, 80) + (last.content.length > 80 ? '\u2026' : '') : 'No messages yet';
    };

    // ── CHAT VIEW ──────────────────────────────────────────────────────────
    if (view === 'chat') return (
      <div className="flex flex-col" style={{height:'calc(100dvh - 122px)'}}>
        {/* Chat header */}
        <div className="flex items-center justify-between px-4 py-3 border-b border-slate-800 flex-shrink-0">
          <button onClick={()=>setView('list')} className="flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
            <ChevLeft/><span className="text-sm">Conversations</span>
          </button>
          <div className="flex items-center gap-2">
            {saving && <span className="text-xs text-slate-500">Saving...</span>}
            <button onClick={openNew} className="text-xs text-blue-400 hover:text-blue-300 font-semibold px-2 py-1 rounded-lg hover:bg-blue-500/10 transition-colors">+ New</button>
          </div>
        </div>
        {/* Messages */}
        <div className="flex-1 overflow-y-auto px-4 py-4 space-y-3">
          {messages.length === 0 && (
            <div className="text-center py-12">
              <div className="text-4xl mb-3">🤖</div>
              <p className="text-slate-400 text-sm">Your coach is ready.<br/>What's on your mind?</p>
            </div>
          )}
          {messages.map((m,i) => (
            <div key={i} className={`flex ${m.role==='user'?'justify-end':'justify-start'}`}>
              <div className={`max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${m.role==='user'?'bg-blue-600 text-white':'bg-slate-800 text-slate-200'}`}>{m.content}</div>
            </div>
          ))}
          {loading && <div className="flex justify-start"><div className="bg-slate-800 text-slate-400 rounded-2xl px-4 py-3 text-sm">Thinking...</div></div>}
          <div ref={endRef}/>
        </div>
        {/* Input */}
        <div className="px-4 py-3 border-t border-slate-800 flex-shrink-0" style={{paddingBottom:'max(12px, env(safe-area-inset-bottom, 12px))'}}>
          <div className="flex gap-2">
            <input
              ref={inputRef}
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyPress={e=>e.key==='Enter'&&send()}
              placeholder="Talk to your coach..."
              disabled={loading}
              className="flex-1 bg-slate-800 border border-slate-700 rounded-xl p-3 text-white placeholder-slate-500 text-sm focus:border-blue-500 focus:outline-none"
            />
            <button onClick={send} disabled={loading||!input.trim()} className="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 text-white p-3 rounded-xl flex-shrink-0"><SendIcon/></button>
          </div>
        </div>
      </div>
    );

    // ── LIST VIEW ──────────────────────────────────────────────────────────
    return (
      <div className="page-content px-4 py-5 space-y-5">
        {/* Header */}
        <div className="flex items-center justify-between">
          <div>
            <h2 className="text-xl font-bold text-white">AI Coach</h2>
            <p className="text-xs text-slate-400">{(conversations||[]).length} conversation{(conversations||[]).length !== 1 ? 's' : ''}</p>
          </div>
          <button onClick={openNew} className="flex items-center gap-2 px-4 py-2 rounded-2xl text-sm font-bold text-white" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>
            <span>+</span> New Chat
          </button>
        </div>

        {/* Empty state */}
        {(conversations||[]).length === 0 && (
          <div className="text-center py-16">
            <div className="text-5xl mb-4">🤖</div>
            <p className="text-white font-bold mb-1">No conversations yet</p>
            <p className="text-slate-400 text-sm mb-6">Your coach will check in when there's something worth discussing — or start a conversation anytime.</p>
            <button onClick={openNew} className="px-6 py-3 rounded-2xl text-sm font-bold text-white" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>
              Start a Conversation
            </button>
          </div>
        )}

        {/* Conversation list grouped by date */}
        {Object.entries(grouped).map(([dateLabel, convs]) => (
          <div key={dateLabel}>
            <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">{dateLabel}</p>
            <div className="space-y-2">
              {convs.map(conv => (
                <button key={conv.id} onClick={()=>openExisting(conv)} className="w-full text-left bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 rounded-2xl p-4 transition-all">
                  <div className="flex items-start justify-between gap-2">
                    <div className="flex-1 min-w-0">
                      <p className="text-white text-sm font-semibold truncate">{conv.title}</p>
                      <p className="text-slate-400 text-xs mt-0.5 line-clamp-2">{getPreview(conv)}</p>
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <span className="text-xs text-slate-500">{new Date(conv.created_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span>
                      <button onClick={(e)=>handleDelete(conv.id, e)} className="text-slate-600 hover:text-red-400 text-xs p-1 rounded transition-colors">✕</button>
                    </div>
                  </div>
                  <p className="text-xs text-slate-500 mt-2">{(conv.messages||[]).filter(m=>m.role==='user').length} messages</p>
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
    );
  };

  // ── ONBOARDING ─────────────────────────────────────────────────────────────
  const OnboardingFlow = ({ onComplete, initialData }) => {
    const [step, setStep] = useState(0);
    const [showAnvilInfo, setShowAnvilInfo] = useState(false);
    const [showSlightEdgeInfo, setShowSlightEdgeInfo] = useState(false);
    const [showStartDateInfo, setShowStartDateInfo] = useState(false);
    const [form, setForm] = useState({
      slightEdge: initialData.slightEdge||'', yearTheme: initialData.yearTheme||'',
      wheelOfJohn: initialData.wheelOfJohn||{family:5,fun:5,fitness:5,finance:5,faith:5},
      vision120Day: initialData.vision120Day||'',
      goals: initialData.goals||[{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''}],
      anvil: initialData.anvil||{project:'',cadence:'',why:''},
      personality: initialData.personality||{style:2,tone:2,approach:2,energy:2},
      startDate: initialData.startDate||'',
      coachProfile: initialData.coachProfile||{years:'',production:'',need:'',obstacle:'',style:'',why:'',drift:'',family:'',niche:'',fear:'',successDef:'',avoiding:'',proud:'',fiveYear:'',holdingBack:''}
    });
    const STEPS = [
      {id:'welcome',isWelcome:true},
      {id:'slightEdge',title:'Your Slight Edge',subtitle:'The habits that built S.E.A.',desc:"S.E.A. stands for Slight Edge Accelerator. The Slight Edge is the philosophy that small, consistent daily habits — compounded over time — create extraordinary results. Your Slight Edges are the specific things YOU do every day that quietly give you an edge. Think: workout, read, journal, cold outreach. What are yours?",prompt:'My Slight Edges are...',placeholder:'e.g. Daily workout, 30 min reading, journaling, practicing guitar, cold outreach calls...',field:'slightEdge',type:'textarea',hasInfo:true},
      {id:'yearTheme',title:'Year Theme',subtitle:'One word or phrase for this year',desc:"Your compass. Every decision this year points back to it. Not a goal — an identity.",prompt:'My year theme is...',placeholder:'e.g. The Year of Execution, Discipline, Breakthrough...',field:'yearTheme',type:'input'},
      {id:'wheel',title:'Wheel of John',subtitle:'Where are you right now?',desc:'Score each life category honestly — not where you want to be, where you ARE. This baseline shapes your vision and goals.',type:'wheel'},
      {id:'vision',title:'120-Day Vision',subtitle:'Who will you BE in 120 days?',desc:"Not what you'll do — who you'll become. Describe that version of yourself.",prompt:'In 120 days, I am someone who...',placeholder:'e.g. I am someone who has built systems that run without me, who shows up fully present for my family...',field:'vision120Day',type:'textarea'},
      {id:'goals',title:'Your Four Goals',subtitle:'Up to 4 goals for this 120-day period',desc:'Set up to 4 goals — specific enough that someone else could tell if you hit them. Quality over quantity.',type:'goals'},
      {id:'anvil',title:'Your Anvil',subtitle:'The one activity that changes everything',type:'anvil'},
      {id:'personality',title:'Your Coach',subtitle:'Set up your coaching style',type:'personality'},
      {id:'startDate',title:'Your 120-Day Start Date',subtitle:'When does your journey begin?',type:'startDate',hasInfo:true},
      {id:'coachProfile',title:'Help Your Coach Know You',subtitle:'Quick answers — makes coaching personal from day one',type:'coachProfile'},
      {id:'complete',isComplete:true}
    ];
    const cur = STEPS[step];
    const progress = (step/(STEPS.length-1))*100;
    const canNext = () => {
      if (cur.isWelcome||cur.isComplete) return true;
      if (cur.field) return form[cur.field].trim().length>0;
      if (cur.type==='goals') return form.goals.some(g=>g.title.trim());
      if (cur.type==='anvil') return form.anvil.project.trim().length>0;
      return true;
    };
    const CATS = [{key:'family',label:'Family',color:'#f43f5e'},{key:'fun',label:'Fun',color:'#f59e0b'},{key:'fitness',label:'Fitness',color:'#10b981'},{key:'finance',label:'Finance',color:'#3b82f6'},{key:'faith',label:'Faith',color:'#a855f7'}];
    return (
      <div className="min-h-screen flex flex-col" style={{background:'linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%)'}}>
        {!cur.isWelcome && !cur.isComplete && <div className="h-1 bg-slate-800"><div className="h-full bg-gradient-to-r from-blue-500 to-purple-500 transition-all duration-500" style={{width:`${progress}%`}}/></div>}
        <div className="flex-1 flex items-center justify-center px-5 py-8">
          <div className="w-full max-w-lg">
            {cur.isWelcome && (
              <div className="text-center slide-up">
                <div className="text-6xl mb-6">🌊</div>
                <h1 className="text-4xl font-bold mb-2" style={{background:'linear-gradient(135deg,#60a5fa,#a78bfa)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>S.E.A. Dashboard</h1>
                <p className="text-slate-400 mb-8">Live By Design, Not By Default</p>
                <div className="bg-slate-800/60 rounded-2xl p-6 border border-slate-700 mb-6 text-left space-y-3">
                  <p className="text-white font-semibold">"Structure sets you free."</p>
                  <p className="text-slate-400 text-sm">This planner is built on the S.E.A. Framework — Strategic, Executable, Accountable. 5 minutes to set up. Changes how you operate.</p>
                  <p className="text-slate-300 text-sm font-medium">Let's build your foundation.</p>
                </div>
                <button onClick={()=>setStep(1)} className="w-full py-4 rounded-2xl font-bold text-lg text-white transition-all" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>Get Started →</button>
                <button onClick={()=>onComplete(form)} className="w-full mt-3 py-2 text-slate-500 hover:text-slate-400 text-sm">Skip setup</button>
              </div>
            )}
            {cur.isComplete && (
              <div className="text-center slide-up">
                <div className="text-6xl mb-4">🎯</div>
                <h2 className="text-3xl font-bold text-white mb-3">Foundation Set.</h2>
                <p className="text-slate-400 mb-6">Here is what to do next:</p>
                <div className="bg-slate-800/60 rounded-2xl p-5 border border-slate-700 mb-6 text-left space-y-3">
                  {[['📅','Plan your week every Sunday in the Week tab'],['☀️','Open Today every morning to set your top 3'],['🔥','Log your Anvil daily — protect the streak'],['🤖','The AI Coach knows your goals — ask it anything'],['⭐','Check your S.E.A. Score in the Score tab']].map(([icon,text],i)=>(
                    <div key={i} className="flex items-start gap-3"><span className="text-xl">{icon}</span><p className="text-sm text-slate-300">{text}</p></div>
                  ))}
                </div>
                <button onClick={()=>onComplete(form)} className="w-full py-4 rounded-2xl font-bold text-lg text-white" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>Open My Planner →</button>
              </div>
            )}
            {!cur.isWelcome && !cur.isComplete && (
              <div className="slide-up">
                <div className="flex justify-between items-center mb-4">
                  <span className="text-xs text-slate-500">Step {step} of {STEPS.length-2}</span>
                  <button onClick={()=>onComplete(form)} className="text-xs text-slate-600 hover:text-slate-400">Skip</button>
                </div>
                <div className="bg-slate-800/60 rounded-2xl p-6 border border-slate-700">
                  <div className="flex items-start justify-between mb-1">
                    <h2 className="text-2xl font-bold text-white">{cur.title}</h2>
                    {cur.hasInfo && (
                      <button onClick={()=>setShowSlightEdgeInfo(true)} className="flex-shrink-0 ml-3 w-8 h-8 rounded-full border border-blue-500/50 text-blue-400 hover:bg-blue-500/20 transition-all flex items-center justify-center font-bold text-sm">i</button>
                    )}
                  </div>
                  {cur.subtitle && <p className="text-slate-400 text-sm mb-4">{cur.subtitle}</p>}
                  {cur.desc && <p className="text-slate-300 text-sm leading-relaxed mb-5 p-4 rounded-xl" style={{background:'rgba(59,130,246,0.1)',borderLeft:'3px solid #3b82f6'}}>{cur.desc}</p>}
                  {cur.type==='input' && <div>{cur.prompt&&<label className="text-xs text-slate-500 block mb-2">{cur.prompt}</label>}<input type="text" value={form[cur.field]} onChange={e=>setForm(p=>({...p,[cur.field]:e.target.value}))} onKeyPress={e=>e.key==='Enter'&&canNext()&&setStep(s=>s+1)} placeholder={cur.placeholder} className="w-full bg-slate-700 border border-slate-600 rounded-xl p-4 text-white placeholder-slate-500 focus:border-blue-500 focus:outline-none text-lg"/></div>}
                  {cur.type==='textarea' && <div>{cur.prompt&&<label className="text-xs text-slate-500 block mb-2">{cur.prompt}</label>}<textarea value={form[cur.field]} onChange={e=>setForm(p=>({...p,[cur.field]:e.target.value}))} placeholder={cur.placeholder} rows={4} className="w-full bg-slate-700 border border-slate-600 rounded-xl p-4 text-white placeholder-slate-500 focus:border-blue-500 focus:outline-none resize-none"/></div>}
                  {cur.type==='personality' && (()=>{
                    const p = form.personality;
                    const DIMS = [
                      {key:'style',  label:'Style',    left:'Coach',      right:'Advisor',     leftDesc:'Push & drive',         rightDesc:'Inform & guide',   color:'#3b82f6'},
                      {key:'tone',   label:'Tone',     left:'Empathetic', right:'Direct',      leftDesc:'Warmth first',         rightDesc:'No fluff',         color:'#a855f7'},
                      {key:'approach',label:'Approach',left:'Accepting',  right:'Challenging', leftDesc:'Meet you where you are',rightDesc:'Push harder',      color:'#10b981'},
                      {key:'energy', label:'Energy',   left:'Calm',       right:'Fired Up',    leftDesc:'Steady & measured',    rightDesc:'Intense & urgent', color:'#f59e0b'},
                    ];
                    const summaryWords = [
                      p.style<=1?'Coach-Style':p.style>=3?'Advisor-Style':'Blended',
                      p.tone<=1?'Empathetic':p.tone>=3?'Direct':'Balanced',
                      p.approach<=1?'Accepting':p.approach>=3?'Challenging':'Supportive',
                      p.energy<=1?'Calm':p.energy>=3?'Fired Up':'Focused',
                    ];
                    return (
                      <div>
                        <p className="text-xs text-slate-400 mb-5">Your coach will feel like: <span className="text-purple-300 font-semibold">{summaryWords.join(', ')}</span></p>
                        <div className="space-y-5">
                          {DIMS.map(d=>(
                            <div key={d.key}>
                              <span className="text-xs font-bold text-slate-300 block mb-2">{d.label}</span>
                              <div className="flex items-center gap-3">
                                <div className="text-right w-20 flex-shrink-0">
                                  <p className="text-xs font-semibold text-white">{d.left}</p>
                                  <p className="text-xs text-slate-500">{d.leftDesc}</p>
                                </div>
                                <input type="range" min="0" max="4" step="1" value={p[d.key]}
                                  onChange={e=>setForm(prev=>({...prev,personality:{...prev.personality,[d.key]:parseInt(e.target.value)}}))}
                                  className="flex-1 h-2 rounded-full appearance-none cursor-pointer"
                                  style={{accentColor:d.color}}/>
                                <div className="w-20 flex-shrink-0">
                                  <p className="text-xs font-semibold text-white">{d.right}</p>
                                  <p className="text-xs text-slate-500">{d.rightDesc}</p>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                        <p className="text-xs text-slate-500 mt-4 text-center">You can always adjust this later in More → Setup</p>
                      </div>
                    );
                  })()}
                  {cur.type==='startDate' && (()=>{
                    const [y,m,d] = form.startDate ? form.startDate.split('-').map(Number) : [null,null,null];
                    const preview = form.startDate ? (()=>{
                      const s = new Date(y,m-1,d);
                      const dow = s.getDay();
                      if(dow!==1){const adj=dow===0?1:8-dow;s.setDate(s.getDate()+adj);}
                      const e = new Date(s); e.setDate(s.getDate()+119);
                      return {start:s,end:e,adjusted:dow!==1};
                    })() : null;
                    return (
                      <div className="space-y-4">
                        <p className="text-slate-300 text-sm">This anchors every week number, date label and calendar view across the entire planner. Choose wisely — it sets the clock on your 120-day journey.</p>
                        <div>
                          <label className="text-xs text-slate-500 block mb-2">Start Date</label>
                          <input type="date" value={form.startDate} onChange={e=>setForm(p=>({...p,startDate:e.target.value}))} className="w-full bg-slate-700 border border-slate-600 rounded-xl p-4 text-white text-base focus:border-blue-500 focus:outline-none"/>
                        </div>
                        {preview && (
                          <div className="p-4 rounded-2xl space-y-1" style={{background:'rgba(59,130,246,0.1)',border:'1px solid rgba(59,130,246,0.3)'}}>
                            <p className="text-xs text-blue-300 font-bold uppercase tracking-wide mb-2">Your 120-Day Window</p>
                            <p className="text-sm text-white">Starts: <span className="font-semibold">{preview.start.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</span></p>
                            <p className="text-sm text-white">Ends: <span className="font-semibold">{preview.end.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</span></p>
                            {preview.adjusted && <p className="text-xs text-yellow-400 mt-1">⚠️ Adjusted to the nearest Monday</p>}
                          </div>
                        )}
                        <p className="text-xs text-slate-500 text-center">You can change this anytime in More → Setup</p>
                      </div>
                    );
                  })()}
                  {cur.type==='coachProfile' && (()=>{
                    const cp = form.coachProfile;
                    const upCP = (key, val) => setForm(p=>({...p, coachProfile:{...p.coachProfile,[key]:val}}));
                    const Pill = ({label, selected, onSelect}) => (
                      <button onClick={onSelect} className={`px-3 py-2 rounded-full text-xs font-semibold transition-all border ${selected?'text-white border-transparent':'border-slate-600 text-slate-400'}`}
                        style={selected?{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}:{}}>
                        {label}
                      </button>
                    );
                    const answered = Object.values(cp).filter(v=>v?.trim()).length;
                    return (
                      <div className="space-y-5">
                        <div className="p-3 rounded-xl" style={{background:'rgba(59,130,246,0.08)',border:'1px solid rgba(59,130,246,0.2)'}}>
                          <div className="flex items-center justify-between mb-1.5">
                            <span className="text-xs text-slate-400">{answered} of 15 answered</span>
                            <span className="text-xs font-bold text-blue-400">{Math.round((answered/15)*100)}%</span>

  const AnvilView = ({ data, updateField, openCoach }) => {

    const [anvilEntry, setAnvilEntry] = useState('');
    const [anvilLogDate, setAnvilLogDate] = useState('');

    const logSession = () => {
      if (!anvilEntry.trim()) return;
      const dateToLog = anvilLogDate ? new Date(anvilLogDate+'T12:00:00').toISOString() : new Date().toISOString();
      const l = [{date:dateToLog,note:anvilEntry.trim()},...(anvil.log||[])];
      updateField('anvilProject',{...anvil,log:l});
      setAnvilEntry(''); setAnvilLogDate('');
    };

    // Streak calc
    const today = new Date(); today.setHours(0,0,0,0);
    const sortedUnique = [...new Set((anvil.log||[]).map(e=>{const d=new Date(e.date);d.setHours(0,0,0,0);return d.toDateString();}))].map(s=>new Date(s)).sort((a,b)=>b-a);
    let streak=0;
    for(let i=0;i<sortedUnique.length;i++){const exp=new Date(today);exp.setDate(today.getDate()-i);if(sortedUnique[i].toDateString()===exp.toDateString())streak++;else break;}

    // This week
    const monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));
    const weekSessions=(anvil.log||[]).filter(e=>new Date(e.date)>=monday).length;

      <div className="page-content px-4 py-5 space-y-5">

            <BotIcon/><span>Coach</span>
          </button>
        </div>

        {/* Stats */}
        <div className="grid grid-cols-3 gap-3">
          {[
            {label:'Streak',val:streak,suffix:'days',color:'#f97316'},
            {label:'This Week',val:weekSessions,suffix:'sessions',color:'#10b981'},

            <div key={s.label} className="bg-slate-800/60 rounded-2xl p-4 border border-slate-700 text-center">

              <p className="text-2xl font-black" style={{color:s.color}}>{s.val}</p>
              <p className="text-xs text-slate-500">{s.suffix}</p>
            </div>
          ))}
        </div>

        <AnvilScoreboard anvilData={anvil}/>

          <h3 className="text-sm font-bold text-orange-400 uppercase tracking-wide mb-3">🔨 Log a Session</h3>
          <div className="space-y-3">
            <input value={anvilEntry} onChange={e=>setAnvilEntry(e.target.value)}
              onKeyPress={e=>{if(e.key==='Enter')logSession();}}
              placeholder={anvil.project?`What did you do on "${anvil.project}"?`:'Log your session...'}
              className="w-full bg-slate-700/50 border border-slate-600/50 rounded-xl p-3 text-white placeholder-slate-500 text-sm focus:border-orange-500 focus:outline-none"/>
            <div className="flex items-center gap-2">
              <label className="text-xs text-slate-400 flex-shrink-0">Date:</label>
              <input type="date" value={anvilLogDate} max={new Date().toISOString().split('T')[0]}
                onChange={e=>setAnvilLogDate(e.target.value)}

              <button onClick={()=>setAnvilLogDate('')} className={`text-xs px-2 py-1 rounded-lg transition-colors ${!anvilLogDate?'bg-orange-500/20 text-orange-400 font-bold':'bg-slate-700 text-slate-400 hover:text-white'}`}>Today</button>
            </div>
            {anvilLogDate&&<p className="text-xs text-orange-300 text-center">📅 Logging for {new Date(anvilLogDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</p>}
            <button onClick={logSession} disabled={!anvilEntry.trim()} className="w-full px-4 py-3 rounded-xl font-bold text-white text-sm disabled:opacity-40 transition-all" style={{background:'linear-gradient(135deg,#f97316,#ef4444)'}}>
              {anvilLogDate?'Log for Past Date ✓':'Log Today ✓'}

          </div>
        </div>

        {/* Setup */}
        <div className="bg-slate-800/60 rounded-2xl p-5 border border-slate-700 space-y-3">

          <div><label className="text-xs text-slate-400 block mb-1">My Anvil is...</label><input value={anvil.project||''} onChange={e=>updateField('anvilProject',{...anvil,project:e.target.value})} placeholder="e.g. 8 appointments per week" className="w-full bg-slate-700/50 border border-slate-600/50 rounded-xl p-3 text-white placeholder-slate-500 text-sm focus:outline-none"/></div>
          <div>
            <label className="text-xs text-slate-400 block mb-1">Frequency</label>
            <div className="flex items-center gap-2">
              <input
                type="number" min="1" max="7"
                value={anvil.freqCount||1}
                onChange={e=>{ const v=Math.min(Math.max(parseInt(e.target.value)||1,1),7); updateField('anvilProject',{...anvil,freqCount:v}); }}
                className="w-14 bg-slate-700/50 border border-slate-600/50 rounded-xl p-3 text-orange-400 font-bold text-center text-sm focus:border-orange-500 focus:outline-none"
              />
              <span className="text-slate-400 text-sm">time(s)</span>
              <select
                value={anvil.freqPeriod||'week'}
                onChange={e=>updateField('anvilProject',{...anvil,freqPeriod:e.target.value})}
                className="flex-1 bg-slate-700/50 border border-slate-600/50 rounded-xl p-3 text-white text-sm focus:border-orange-500 focus:outline-none"
              >
                <option value="week">per week</option>
                <option value="biweekly">every 2 weeks</option>
                <option value="month">per month</option>
              </select>
            </div>
            <p className="text-xs text-slate-500 mt-1">Scoring: hit your target this period = full 25 pts</p>
          </div>
          <div><label className="text-xs text-slate-400 block mb-1">Why this one?</label><textarea value={anvil.why||''} onChange={e=>updateField('anvilProject',{...anvil,why:e.target.value})} rows={2} placeholder="What makes this your highest-leverage activity..." className="w-full bg-slate-700/50 border border-slate-600/50 rounded-xl p-3 text-white placeholder-slate-500 text-sm resize-none focus:outline-none"/></div>
        </div>

        {/* Recent Sessions */}
        {(anvil.log||[]).length>0&&(
          <div className="bg-slate-800/60 rounded-2xl p-5 border border-slate-700">
            <h3 className="text-sm font-bold text-slate-300 mb-3">Recent Sessions</h3>
            <div className="space-y-2 max-h-64 overflow-y-auto">
              {(anvil.log||[]).map((e,i)=>(
                <div key={i} className="flex items-start gap-3 p-3 bg-slate-700/30 rounded-xl">
                  <span className="text-green-400 text-sm mt-0.5">✓</span>
                  <div className="flex-1"><p className="text-sm text-white">{e.note}</p><p className="text-xs text-slate-500 mt-0.5">{new Date(e.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</p></div>
                  <button onClick={()=>{const l=(anvil.log||[]).filter((_,j)=>j!==i);updateField('anvilProject',{...anvil,log:l});}} className="text-slate-600 hover:text-red-400 text-xs">✕</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    );
  };

  // ── TODAY VIEW ─────────────────────────────────────────────────────────────
  const TodayView = ({ data, updateField, weekNum, dayIdx, setDayIdx, openCoach, score, onPrint, setActiveTab }) => {
    const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const dayFull  = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const day = data.dailyPlans[weekNum-1][dayIdx];
    const updateDay = (f,v) => { const p=JSON.parse(JSON.stringify(data.dailyPlans)); p[weekNum-1][dayIdx][f]=v; updateField('dailyPlans',p); };
    const [showCarryOver, setShowCarryOver] = useState(false);

    // Time of day detection
    const hour = new Date().getHours();
    const timeOfDay = hour >= 5 && hour < 12 ? 'morning' : hour >= 17 ? 'evening' : 'midday';

    // Time-based default open states
    const defaultsByTime = {
      morning: { gratitude: false, reflection: false, notes: false, evening: false },
      midday:  { gratitude: false, reflection: false, notes: false, evening: false },
      evening: { gratitude: false, reflection: true,  notes: false, evening: true  },
    };

    // Collapsible sections — time-aware, resets each day, user can override within the day
    const [open, setOpen] = useState(()=>{
      try {
        const storedDate = localStorage.getItem('today-open-date');
        const todayStr = new Date().toDateString();
        if (storedDate === todayStr) {
          // Same day — use stored user preferences
          return JSON.parse(localStorage.getItem('today-open') || 'null') || defaultsByTime[timeOfDay];
        }
        // New day — use time-based defaults
        return defaultsByTime[timeOfDay];
      } catch(e) { return defaultsByTime[timeOfDay]; }
    });

    const toggle = (key) => {
      const next = {...open, [key]: !open[key]};
      setOpen(next);
      localStorage.setItem('today-open', JSON.stringify(next));
      localStorage.setItem('today-open-date', new Date().toDateString());
    };
    const isOpen = (key) => !!open[key];

    // Auto-populate Top 3 from yesterday's Tomorrow priorities
    React.useEffect(() => {
      const todayDi = new Date().getDay()===0?6:new Date().getDay()-1;
      if (dayIdx !== todayDi) return;
      const todayPriorities = day.aActivities || [];
      const allEmpty = todayPriorities.every(p => !p || !p.trim());
      if (!allEmpty) return;
      let yPriorities = null;
      if (dayIdx > 0) yPriorities = data.dailyPlans[weekNum-1][dayIdx-1]?.tomorrowPriorities;
      else if (weekNum > 1) yPriorities = data.dailyPlans[weekNum-2][6]?.tomorrowPriorities;
      if (yPriorities && yPriorities.some(p => p?.trim())) {
        // Auto-apply silently
        const p = JSON.parse(JSON.stringify(data.dailyPlans));
        p[weekNum-1][dayIdx].aActivities = [...yPriorities];
        updateField('dailyPlans', p);
        setShowCarryOver(true); // show confirmation banner instead of prompt
      }
    }, [dayIdx, weekNum]);

    const applyCarryOver = () => {
      let yPriorities = null;
      if (dayIdx > 0) yPriorities = data.dailyPlans[weekNum-1][dayIdx-1]?.tomorrowPriorities;
      else if (weekNum > 1) yPriorities = data.dailyPlans[weekNum-2][6]?.tomorrowPriorities;
      if (yPriorities) {
        const p = JSON.parse(JSON.stringify(data.dailyPlans));
        p[weekNum-1][dayIdx].aActivities = [...yPriorities];
        updateField('dailyPlans', p);
      }
      setShowCarryOver(false);
    };

    // Always compute dates relative to the actual current day — never derive from startDate
    const getRealDate = (di) => {
      const now = new Date(); now.setHours(0,0,0,0);
      const todayDi = now.getDay()===0?6:now.getDay()-1; // Mon=0 … Sun=6
      const result = new Date(now);
      result.setDate(now.getDate() + (di - todayDi));
      return result;
    };
    const todayRealDate = getRealDate(dayIdx);
    const todayStr = todayRealDate.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    const greeting = hour<12?'Good morning':hour<17?'Good afternoon':'Good evening';

    const anvilLog = data.anvilProject?.log||[];
    let anvilStreak=0;
    if(anvilLog.length>0){const now=new Date();now.setHours(0,0,0,0);const sorted=anvilLog.map(e=>{const d=new Date(e.date);d.setHours(0,0,0,0);return d;}).sort((a,b)=>b-a);const unique=[...new Set(sorted.map(d=>d.toDateString()))].map(s=>new Date(s));for(let i=0;i<unique.length;i++){const exp=new Date(now);exp.setDate(now.getDate()-i);if(unique[i].toDateString()===exp.toDateString())anvilStreak++;else break;}}

    return (
      <div className="page-content px-4 py-5 space-y-5">
        {/* Header */}
        <div className="flex items-start justify-between">
          <div>
            <div className="flex items-center gap-2 mb-0.5">

              <span className="text-xs px-2 py-0.5 rounded-full font-semibold" style={{
