              }}>
                {timeOfDay==='morning' ? '☀️ Morning' : timeOfDay==='evening' ? '🌙 Evening' : '🌤 Midday'}
              </span>
            </div>
            <h1 className="text-2xl font-bold text-white">{todayStr}</h1>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={onPrint} className="no-print p-2.5 rounded-xl bg-slate-800/60 border border-slate-700 hover:border-slate-500 text-slate-400 hover:text-white transition-all" title="Print Today"><PrintIcon/></button>
            <button onClick={()=>openCoach({section:'daily',day:dayFull[dayIdx]})} className="flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-medium" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>
              <BotIcon/><span>Coach</span>
            </button>
          </div>
        </div>

        {/* Day selector */}
        <div className="flex gap-2 overflow-x-auto pb-1">
          {dayNames.map((d,i)=>{
            const dt=getRealDate(i);
            return(
              <button key={i} onClick={()=>setDayIdx(i)} className={`flex-shrink-0 flex flex-col items-center px-3 py-2 rounded-xl transition-all ${dayIdx===i?'text-white':'bg-slate-800/60 text-slate-400 hover:bg-slate-700/60'}`} style={dayIdx===i?{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}:{}}>
                <span className="text-xs font-medium">{d}</span>
                {dt&&<span className="text-xs opacity-70">{dt.getDate()}</span>}
              </button>
            );
          })}
        </div>

        {/* Agreement of the Day */}
        {(()=>{
          const AGREEMENTS = [
            {num:1, text:'Be Impeccable With Your Word', icon:'🗣️', color:'#3b82f6', desc:'Your word is your bond. Say what you mean, mean what you say. No gossip, no excuses, no broken promises.'},
            {num:2, text:'Be Responsible for All Your Outcomes', icon:'🎯', color:'#10b981', desc:'Own everything. Your results, your relationships, your circumstances. No blame, no victims — only accountability.'},
            {num:3, text:'Be Coachable', icon:'🧠', color:'#a855f7', desc:'Stay open. The best are always learning. Ego stops growth. Humility accelerates it.'},
            {num:4, text:'Leave a Place Better Than You Found It', icon:'✨', color:'#f59e0b', desc:'Every room, every relationship, every situation. Add value wherever you go. Always leave things better.'},
            {num:5, text:"Don't Leave Any Duties Unattended", icon:'✅', color:'#f43f5e', desc:'Finish what you start. Follow through. The gap between who you are and who you want to be is closed by execution.'},
          ];
          const todayIdx = new Date().getDay();
          const a = AGREEMENTS[todayIdx % 5];
          const [showAll, setShowAll] = React.useState(false);
          return (
            <>
              <button onClick={()=>setShowAll(true)} className="w-full rounded-2xl px-4 py-3 flex items-center gap-3 text-left transition-all active:scale-98" style={{background:`linear-gradient(135deg,${a.color}18,${a.color}08)`,border:`1px solid ${a.color}30`}}>
                <span className="text-2xl flex-shrink-0">{a.icon}</span>
                <div className="flex-1 min-w-0">
                  <p className="text-xs font-bold uppercase tracking-wide mb-0.5" style={{color:a.color}}>Agreement {a.num} · Today</p>
                  <p className="text-sm font-semibold text-white leading-snug">{a.text}</p>
                </div>
                <span className="text-xs font-bold px-2.5 py-1 rounded-full flex-shrink-0 text-white" style={{background:a.color}}>All 5 →</span>
              </button>
              {showAll && (
                <div className="fixed inset-0 z-50 flex flex-col items-center justify-end md:justify-center px-0 md:px-5" style={{backgroundColor:'rgba(0,0,0,0.85)',backdropFilter:'blur(6px)'}} onClick={()=>setShowAll(false)}>
                  <div className="bg-slate-900 rounded-t-3xl md:rounded-3xl w-full border-t md:border border-slate-700 pop-in flex flex-col mx-auto max-w-lg" style={{maxHeight:'calc(100vh - 80px)'}} onClick={e=>e.stopPropagation()}>
                    {/* Fixed header */}
                    <div className="flex-shrink-0 px-5 pt-5 pb-3">
                      <div className="w-10 h-1 bg-slate-600 rounded-full mx-auto mb-4"/>
                      <h3 className="text-lg font-black text-white text-center">The Five Agreements</h3>
                    </div>
                    {/* Scrollable content */}
                    <div className="flex-1 overflow-y-auto px-5 pb-3 space-y-3">
                      {AGREEMENTS.map(ag=>(
                        <div key={ag.num} className="rounded-2xl p-4 flex items-start gap-3" style={{background:`${ag.color}12`,border:`1px solid ${ag.color}30`}}>
                          <span className="text-xl flex-shrink-0 mt-0.5">{ag.icon}</span>
                          <div>
                            <p className="text-xs font-bold uppercase tracking-wide mb-0.5" style={{color:ag.color}}>Agreement {ag.num}</p>
                            <p className="text-sm font-semibold text-white mb-1">{ag.text}</p>
                            <p className="text-xs text-slate-400 leading-relaxed">{ag.desc}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                    {/* Close button — clears tab bar on mobile, normal padding on desktop */}
                    <div className="flex-shrink-0 px-5 pt-3 border-t border-slate-800 md:pb-5" style={{paddingBottom:'max(20px, calc(64px + env(safe-area-inset-bottom, 0px)))'}}>
                      <button onClick={()=>setShowAll(false)} className="w-full py-3.5 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl text-sm font-bold transition-colors">
                        Close
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </>
          );
        })()}

        {/* Score + Anvil streak */}
        <div className="grid grid-cols-2 gap-3">
          <button onClick={()=>setActiveTab&&setActiveTab('score')} className="bg-slate-800/60 rounded-2xl p-4 border border-slate-700 flex flex-col items-center hover:border-blue-500/50 transition-all active:scale-95" style={{cursor:'pointer'}}>
            <p className="text-xs text-slate-400 mb-2">S.E.A. Score</p>
            <StarRating score={score.total} size={24}/>
            <p className="text-2xl font-bold text-white mt-1">{score.total}</p>
            <p className="text-xs text-blue-400 mt-1 opacity-60">tap to view →</p>
          </button>
          <button onClick={()=>setActiveTab&&setActiveTab('anvil')} className="bg-slate-800/60 rounded-2xl p-4 border border-slate-700 flex flex-col items-center hover:border-orange-500/50 transition-all active:scale-95" style={{cursor:'pointer'}}>
            <p className="text-xs text-slate-400 mb-1">Anvil Streak</p>
            <div className="flex items-center gap-1"><span className="text-3xl">🔥</span></div>
            <p className="text-3xl font-bold text-white">{anvilStreak}</p>
            <p className="text-xs text-slate-500">days</p>
            <p className="text-xs text-orange-400 mt-1 opacity-60">tap to view →</p>
          </button>
        </div>

        {/* Daily Reflection Prompt */}
        {(()=>{
          const PROMPTS = [
            "What would make today a 10 out of 10?",
            "What is the one conversation you've been avoiding that you need to have?",
            "Where are you tolerating mediocrity in your life or business right now?",
            "What habit, if done consistently for 90 days, would change everything?",
            "Who in your life deserves more of your attention and presence?",
            "What are you most afraid of failing at — and why haven't you started?",
            "If you could only work 4 hours today, what would you absolutely have to get done?",
            "What does the best version of you do today that the average version skips?",
            "Where are you spending time that isn't aligned with your goals?",
            "What commitment have you made to yourself that you've been breaking?",
            "What would you do differently if you knew you couldn't fail?",
            "Who do you need to become to achieve your 120-day vision?",
            "What's one thing you can do today to strengthen your most important relationship?",
            "Where is drift showing up in your life right now?",
            "What does winning this week actually look like?",
            "What are you grateful for that you rarely stop to acknowledge?",
            "What's the hardest thing you need to do today — and why are you avoiding it?",
            "How would your future self evaluate the choices you're making right now?",
            "What belief is holding you back that you know isn't true?",
            "What would you need to let go of to move forward?",
          ];
          const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(),0,0)) / 86400000);
          const prompt = PROMPTS[dayOfYear % PROMPTS.length];
          return (
            <Section id="reflection" label="💭 Reflection" color="text-purple-400" open={isOpen("reflection")} onToggle={toggle} badge={day.reflection?.trim()?'✓':null}>
              <p className="text-sm text-slate-200 leading-relaxed font-medium mb-3">{prompt}</p>
              <textarea
                value={day.reflection||''}
                onChange={e=>updateDay('reflection',e.target.value)}
                placeholder="Write your thoughts here..."
                rows={3}
                className="w-full bg-slate-800/60 border border-purple-500/20 rounded-xl p-3 text-white placeholder-slate-500 text-sm resize-none focus:border-purple-500 focus:outline-none"
              />
              <button onClick={()=>setActiveTab('journal')} className="mt-3 w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-bold text-purple-300 border border-purple-500/40 hover:bg-purple-500/10 transition-all">
                <span>📓</span><span>View Journal History</span>
              </button>
            </Section>
          );
        })()}

        {/* Carry-over banner */}
        {showCarryOver && (
          <div className="rounded-2xl p-4 border border-green-500/40 flex items-center justify-between gap-3" style={{background:'rgba(16,185,129,0.1)'}}>
            <div>
              <p className="text-sm font-bold text-green-300">✓ Tomorrow's priorities loaded</p>
              <p className="text-xs text-slate-400 mt-0.5">Your Top 3 from yesterday are ready to go</p>
            </div>
            <button onClick={()=>setShowCarryOver(false)} className="px-3 py-1.5 rounded-xl text-xs text-slate-400 bg-slate-700 hover:bg-slate-600 transition-colors flex-shrink-0">Got it</button>
          </div>
        )}

        {/* Top 3 Priorities */}
        <div className="bg-slate-800/60 rounded-2xl p-5 border border-slate-700">
          <h3 className="text-sm font-bold text-blue-400 uppercase tracking-wide mb-3">Top 3 Priorities Today</h3>
          <div className="space-y-2">
            {[0,1,2].map(i=>(
              <div key={i} className="flex items-center gap-3">
                <span className="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0" style={{background:'rgba(59,130,246,0.2)',color:'#60a5fa'}}>{i+1}</span>
                <input value={day.aActivities[i]||''} onChange={e=>{const a=[...day.aActivities];a[i]=e.target.value;updateDay('aActivities',a);}} placeholder={`Priority ${i+1}`} className="flex-1 bg-slate-700/50 border border-slate-600/50 rounded-xl p-3 text-white placeholder-slate-500 text-sm focus:border-blue-500 focus:outline-none"/>
              </div>
            ))}
          </div>
        </div>

        {/* Habit Tracker — full week grid */}
        <div className="bg-slate-800/60 rounded-2xl p-5 border border-slate-700">
          <div className="flex items-center justify-between mb-4">
            <h3 className="text-sm font-bold text-yellow-400 uppercase tracking-wide">Habit Tracker</h3>
            <button onClick={()=>{const a=JSON.parse(JSON.stringify(data.weeks[weekNum-1].aActivities||[]));a.push({name:'',days:[false,false,false,false,false,false,false]});const ws=JSON.parse(JSON.stringify(data.weeks));ws[weekNum-1].aActivities=a;updateField('weeks',ws);}} className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold text-yellow-400 border border-yellow-500/30 hover:bg-yellow-500/10 transition-all">
              + Add Habit
            </button>
          </div>
          <div className="space-y-5">
            {(data.weeks[weekNum-1].aActivities||[]).map((act,ai)=>(
              <HabitRow key={ai} act={act} ai={ai}
                onUpdate={updated=>{ const ws=JSON.parse(JSON.stringify(data.weeks)); ws[weekNum-1].aActivities[ai]=updated; updateField('weeks',ws); }}
                onRemove={()=>{ const ws=JSON.parse(JSON.stringify(data.weeks)); ws[weekNum-1].aActivities.splice(ai,1); updateField('weeks',ws); }}
              />
            ))}
            {(data.weeks[weekNum-1].aActivities||[]).length === 0 && (
              <p className="text-center text-slate-500 text-sm py-2">No habits yet — tap Add Habit to get started</p>
            )}
          </div>
        </div>

        {/* Evening Review */}
        <Section id="evening" label="🌙 Evening Review" color="text-orange-400" open={isOpen("evening")} onToggle={toggle}>
          <div className="space-y-4">
            <div>
              <label className="text-xs text-slate-400 block mb-2">Today's Wins</label>
              {[0,1,2].map(i=>(
                <div key={i} className="flex items-center gap-3 mb-2">
                  <span className="text-yellow-400">★</span>
                  <input value={day.todaysWins?.[i]||''} onChange={e=>{const w=day.todaysWins||['','',''];const nw=[...w];nw[i]=e.target.value;updateDay('todaysWins',nw);}} placeholder={`Win ${i+1}`} className="flex-1 bg-slate-700/50 border border-slate-600/50 rounded-xl p-3 text-white placeholder-slate-500 text-sm focus:border-yellow-500 focus:outline-none"/>
                </div>
              ))}
            </div>
            {[
              {field:'hardThings',doneField:'hardThingsCompleted',label:'Hard Thing Done Today',placeholder:'What difficult thing did you tackle?',color:'red'},
              {field:'stillness',doneField:'stillnessCompleted',label:'Stillness',placeholder:'Meditation, prayer, quiet time...',color:'indigo'},
              {field:'study',doneField:'studyCompleted',label:'Study',placeholder:'What are you learning?',color:'teal'},

              <div key={field}>
                <label className="text-xs text-slate-400 block mb-2">{label}</label>
                <div className="flex items-center gap-3">

  // ── WEEK VIEW ──────────────────────────────────────────────────────────────

    return (
      <div className="page-content px-4 py-5 space-y-5">
        <Confetti active={showConfetti}/>

        <div className="flex items-center justify-between">

            </div>
            <div className="space-y-4 mb-4">
              {(week.aActivities||[]).map((act,ai)=>(
                <HabitRow key={ai} act={act} ai={ai}
                  onUpdate={updated=>{ const a=JSON.parse(JSON.stringify(week.aActivities||[])); a[ai]=updated; updateWeek('aActivities',a); }}
                  onRemove={()=>{ const a=JSON.parse(JSON.stringify(week.aActivities||[])); a.splice(ai,1); updateWeek('aActivities',a); }}
                />

              {(week.aActivities||[]).length===0&&<p className="text-center text-slate-500 text-sm py-2">No habits yet — tap Add to get started</p>}
            </div>
            <div className="flex gap-3">
              <button onClick={()=>setRitualStep(3)} className="px-4 py-3 bg-slate-700 rounded-xl text-white text-sm">← Back</button>
              <button onClick={()=>setRitualStep(5)} className="flex-1 py-3 rounded-xl font-semibold text-white text-sm" style={{background:'linear-gradient(135deg,#3b82f6,#8b5cf6)'}}>Next →</button>
            </div>
          </div>

        {/* Step 5: Messes */}
        {ritualStep===5 && (
          <div className="bg-slate-800/60 rounded-2xl p-5 border border-slate-700 slide-up">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-sm font-bold text-red-400 uppercase tracking-wide">Messes to Clean Up</h3>
              <button onClick={()=>{const m=JSON.parse(JSON.stringify(week.messes||[]));m.push({description:'',nextSteps:'',byWhen:'',completed:false});updateWeek('messes',m);}} className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold text-red-400 border border-red-500/30 hover:bg-red-500/10 transition-all">+ Add</button>
            </div>
            <div className="space-y-3 mb-4">
              {(week.messes||[]).length===0&&<p className="text-center text-slate-500 text-sm py-2">No messes — nice! Add one if needed.</p>}
              {(week.messes||[]).map((mess,mi)=>{
                const upd=(f,v)=>{const m=JSON.parse(JSON.stringify(week.messes||[]));m[mi]={...m[mi],[f]:v};updateWeek('messes',m);};
                const remove=()=>{const m=JSON.parse(JSON.stringify(week.messes||[]));m.splice(mi,1);updateWeek('messes',m);};
                return(
                  <div key={mi} className={`rounded-xl p-3 border ${mess.completed?'border-green-500/30 opacity-60':'border-slate-600'} bg-slate-700/30`}>
                    <div className="flex gap-2 mb-2">
                      <input value={mess.description||''} onChange={e=>upd('description',e.target.value)} placeholder={`Mess ${mi+1}`} className="flex-1 bg-slate-700/50 border border-slate-600/50 rounded-xl p-2 text-white placeholder-slate-500 text-sm focus:outline-none"/>
                      <button onClick={()=>upd('completed',!mess.completed)} className={`w-9 h-9 rounded-xl flex items-center justify-center border transition-all flex-shrink-0 ${mess.completed?'border-green-500 bg-green-500/20 text-green-400':'border-slate-600 text-slate-500'}`}><CheckIcon/></button>
                      <button onClick={remove} className="w-9 h-9 rounded-xl flex items-center justify-center text-slate-600 hover:text-red-400 transition-all text-lg flex-shrink-0">✕</button>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <input value={mess.nextSteps||''} onChange={e=>upd('nextSteps',e.target.value)} placeholder="Next step" className="bg-slate-700/50 border border-slate-600/50 rounded-lg p-2 text-white placeholder-slate-500 text-xs focus:outline-none"/>
                      <input type="date" value={mess.byWhen||''} onChange={e=>upd('byWhen',e.target.value)} className="bg-slate-700/50 border border-slate-600/50 rounded-lg p-2 text-white text-xs focus:outline-none"/>

                <input value={week.goalPriorities[i]||''} onChange={e=>{const p=[...week.goalPriorities];p[i]=e.target.value;updateWeek('goalPriorities',p);}} placeholder={`Priority ${i+1}`} className="flex-1 bg-slate-700/50 border border-slate-600/50 rounded-xl p-3 text-white placeholder-slate-500 text-sm focus:border-blue-500 focus:outline-none"/>

  // ── ANVIL SCOREBOARD ──────────────────────────────────────────────────────
  const AnvilScoreboard = ({ anvilData }) => {
    const log = anvilData?.log || [];
    const project = anvilData?.project || 'Anvil';
    const cadenceStr = (anvilData?.cadence || '').toLowerCase();

    // Parse cadence target
    const parseCadence = () => {
      if (!cadenceStr) return null;
      if (cadenceStr.includes('daily') || cadenceStr.includes('7x') || cadenceStr.includes('every day')) return 7;
      const m = cadenceStr.match(/(\d+)x/);
      if (m) return parseInt(m[1]);
      if (cadenceStr.includes('5') || cadenceStr.includes('five')) return 5;
      if (cadenceStr.includes('3') || cadenceStr.includes('three')) return 3;
      if (cadenceStr.includes('4') || cadenceStr.includes('four')) return 4;
      if (cadenceStr.includes('2') || cadenceStr.includes('twice') || cadenceStr.includes('two')) return 2;
      return null;
    };
    const cadenceTarget = parseCadence();

    // Build a set of logged date strings (YYYY-MM-DD) in local time
    const loggedDates = new Set(log.map(e => {
      const d = new Date(e.date);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }));
    const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const isLogged = d => loggedDates.has(dateKey(d));

    // Current streak
    const today = new Date(); today.setHours(0,0,0,0);
    let streak = 0;
    const sortedUnique = [...new Set(log.map(e => { const d = new Date(e.date); d.setHours(0,0,0,0); return d.toDateString(); }))].map(s => new Date(s)).sort((a,b) => b-a);
    for (let i = 0; i < sortedUnique.length; i++) {
      const exp = new Date(today); exp.setDate(today.getDate() - i);
      if (sortedUnique[i].toDateString() === exp.toDateString()) streak++;
      else break;
    }

    // This week (Mon–Sun)
    const weekStart = new Date(today);
    weekStart.setDate(today.getDate() - ((today.getDay() + 6) % 7));
    const weekDays = Array(7).fill(null).map((_, i) => { const d = new Date(weekStart); d.setDate(weekStart.getDate() + i); return d; });
    const weekHits = weekDays.filter(d => isLogged(d)).length;

    // Last 35 days (5 weeks × 7) — start from 34 days ago to today
    const gridStart = new Date(today); gridStart.setDate(today.getDate() - 34);
    // align to Monday
    const dayOfWeek = (gridStart.getDay() + 6) % 7;
    gridStart.setDate(gridStart.getDate() - dayOfWeek);
    const grid = Array(35).fill(null).map((_, i) => { const d = new Date(gridStart); d.setDate(gridStart.getDate() + i); return d; });
    const monthHits = grid.filter(d => isLogged(d) && d <= today).length;

    // Best week
    let bestWeek = 0;
    for (let w = 0; w < 5; w++) {
      const wHits = grid.slice(w*7, w*7+7).filter(d => isLogged(d) && d <= today).length;
      if (wHits > bestWeek) bestWeek = wHits;
    }

    const dayLabels = ['M','T','W','T','F','S','S'];
    const hitColor = '#f97316';
    const missColor = 'rgba(30,41,59,0.8)';
    const futureColor = 'rgba(15,23,42,0.4)';

    return (
      <div className="bg-slate-800/60 rounded-2xl p-5 border border-slate-700">
        {/* Header */}
        <div className="flex items-center justify-between mb-4">
          <div>
            <h3 className="text-sm font-bold text-orange-400 uppercase tracking-wide">🔨 Anvil Scoreboard</h3>
            {project && <p className="text-xs text-slate-400 mt-0.5 truncate max-w-[180px]">{project}</p>}
          </div>
          <div className="flex items-center gap-1.5 bg-slate-700/60 rounded-xl px-3 py-2">
            <span className="text-xl">🔥</span>
            <div>
              <p className="text-xl font-black text-white leading-none">{streak}</p>
              <p className="text-xs text-slate-400">streak</p>
            </div>
          </div>
        </div>

        {/* Stats Row */}
        <div className="grid grid-cols-3 gap-2 mb-5">
          {[
            { label: 'This Week', value: cadenceTarget ? `${weekHits}/${cadenceTarget}` : `${weekHits}`, sub: 'sessions', color: weekHits >= (cadenceTarget||1) ? '#10b981' : weekHits > 0 ? '#f59e0b' : '#ef4444' },

          if (weeksWithData.length < 2) return null;
          const W = 320, H = 100, pad = 24;
          const scores = weeksWithData.map(({s})=>s.total);
          const minS = Math.max(0, Math.min(...scores) - 10);
          const maxS = Math.min(100, Math.max(...scores) + 10);
          const xScale = (i) => pad + (i / (weeksWithData.length-1)) * (W - pad*2);
          const yScale = (v) => H - pad - ((v - minS) / (maxS - minS)) * (H - pad*2);
          const points = weeksWithData.map(({s},i) => `${xScale(i)},${yScale(s.total)}`).join(' ');
          const areaPoints = `${xScale(0)},${H-pad} ${points} ${xScale(weeksWithData.length-1)},${H-pad}`;
          const latestScore = scores[scores.length-1];
          const prevScore = scores[scores.length-2];
          const trend = latestScore - prevScore;
          const trendColor = trend > 0 ? '#10b981' : trend < 0 ? '#ef4444' : '#94a3b8';
          return (
            <div className="bg-slate-800/60 rounded-2xl p-5 border border-slate-700">

              </div>
              <svg width="100%" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
                {/* Grid lines */}
                {[0,25,50,75,100].filter(v=>v>=minS&&v<=maxS).map(v=>(
                  <line key={v} x1={pad} y1={yScale(v)} x2={W-pad} y2={yScale(v)} stroke="rgba(51,65,85,0.5)" strokeWidth="1" strokeDasharray="3,3"/>
                ))}
                {/* Area fill */}
                <polygon points={areaPoints} fill="rgba(99,102,241,0.12)"/>
                {/* Line */}
                <polyline points={points} fill="none" stroke="#6366f1" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                {/* Dots */}
                {weeksWithData.map(({s,i:wi},i)=>{
                  const col = s.total>=80?'#10b981':s.total>=60?'#f59e0b':s.total>=40?'#f97316':'#ef4444';
                  return <circle key={i} cx={xScale(i)} cy={yScale(s.total)} r="4" fill={col} stroke="#0f172a" strokeWidth="1.5"/>;
                })}
                {/* Week labels */}
                {weeksWithData.map(({i:wi},i)=>(
                  <text key={i} x={xScale(i)} y={H-4} textAnchor="middle" fill="#475569" fontSize="9">W{wi+1}</text>
                ))}
              </svg>
              <div className="flex gap-3 mt-2 text-xs text-slate-500">
                <span><span className="text-green-400">●</span> 80+</span>
                <span><span className="text-yellow-400">●</span> 60–79</span>
                <span><span className="text-orange-400">●</span> 40–59</span>
                <span><span className="text-red-400">●</span> &lt;40</span>
              </div>
            </div>
          );
        })()}

        {/* 17-Week Grid */}

  const calcWeekNum = (startDate) => {
    if (!startDate) return 1;
    const [y,m,d] = startDate.split('-').map(Number);
    const start = new Date(y, m-1, d);
    const dow = start.getDay();
    if (dow !== 1) { const adj = dow===0?1:8-dow; start.setDate(start.getDate()+adj); }
    const now = new Date(); now.setHours(0,0,0,0);
    const diffDays = Math.floor((now - start) / (24*60*60*1000));
    const week = Math.floor(diffDays / 7) + 1;
    return Math.max(1, Math.min(17, week));
  };

          // Restore _meta settings to localStorage if present
          if (cloudData._meta) {
            const m = cloudData._meta;
            if (m.coachProfile) localStorage.setItem('coach-profile', JSON.stringify(m.coachProfile));
            if (m.coachPersonality) localStorage.setItem('coach-personality', m.coachPersonality);
            if (m.summaryEmail) localStorage.setItem('summary-email', m.summaryEmail);
            if (m.summaryName) localStorage.setItem('summary-name', m.summaryName);
            if (m.summaryOptIn) localStorage.setItem('summary-optin', m.summaryOptIn);
            if (m.coachCommitment) localStorage.setItem('coach-commitment', m.coachCommitment);
            if (m.coachCommitmentDate) localStorage.setItem('coach-commitment-date', m.coachCommitmentDate);
            if (m.shareUsed) localStorage.setItem('share-used', m.shareUsed);
            if (m.coachId) localStorage.setItem('sea_coach_id', m.coachId);
            if (m.archives && m.archives.length > 0) localStorage.setItem('sea-archives', JSON.stringify(m.archives));
          }
          // Strip _meta before setting into app state (it's not planner data)
          const { _meta, ...plannerData } = cloudData;
          localStorage.setItem('sea-planner-data', JSON.stringify(plannerData));
          setData(plannerData);
        } else {
          // No cloud data = new user — send welcome email
          const alreadyWelcomed = localStorage.getItem('sea-welcomed');
          if (!alreadyWelcomed) {
            localStorage.setItem('sea-welcomed', '1');
            const userEmail = (await _supabase.auth.getUser()).data.user?.email;
            fetch('/.netlify/functions/welcome-email', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: userEmail, name: '' }),
            }).catch(e => console.error('welcome email error:', e));
          }
          const localRaw = localStorage.getItem('sea-planner-data');
          const localData = localRaw ? JSON.parse(localRaw) : null;
          if (localData) await savePlannerDataToCloud(userId, localData);
        }
      } catch (e) {
        console.error('syncPlannerData error:', e);
      }
    };

    // Sync coach ID from localStorage → Supabase profile (runs once on login)
    const syncCoachIdToProfile = async (userId) => {
      try {
        const localCoachId = localStorage.getItem('sea_coach_id');
        // Reject missing or anonymous IDs (adv_ prefix = old local format, not a real Supabase UUID)
        if (!localCoachId || localCoachId.startsWith('adv_')) return;
        const session = await _supabase.auth.getSession();
        const token = session.data.session?.access_token;
        if (!token) return;
        // Only write if profile coach_id is currently null
        const profileRes = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}&select=coach_id`, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` }
        });
        const profileRows = await profileRes.json();
        const currentCoachId = profileRows?.[0]?.coach_id;
        if (!currentCoachId) {
          await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}`, {
            method: 'PATCH',
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal',
            },
            body: JSON.stringify({ coach_id: localCoachId }),
          });
        }
      } catch (e) {
        console.error('syncCoachIdToProfile error:', e);
      }
    };

    const saveData = useCallback((d)=>{
      try{localStorage.setItem('sea-planner-data',JSON.stringify(d||data));setSaveStatus('Saved ✓');setTimeout(()=>setSaveStatus(''),2000);}
      catch(e){setSaveStatus('Error');}
    },[data]);

    useEffect(()=>{

      setSaveStatus('...');
      // Save to localStorage immediately, cloud after 1.5s debounce
      try{localStorage.setItem('sea-planner-data',JSON.stringify(data));} catch(e){}
      saveTimer.current=setTimeout(()=>{
        saveData(data);
        if(authUser) savePlannerDataToCloud(authUser.id, data);
      },1500);
      return()=>clearTimeout(saveTimer.current);
    },[data]);

    // Force-save to cloud when user closes/navigates away
    useEffect(()=>{
      const handleUnload = () => {
        if(!authUser) return;
        // Always save to localStorage first (synchronous, guaranteed)
        try{localStorage.setItem('sea-planner-data',JSON.stringify(data));} catch(e){}
        // Use sendBeacon for reliable async-safe cloud save on page close
        // sendBeacon is specifically designed for this — browser guarantees delivery even during unload
        try {
          const meta = {
            coachProfile: (() => { try { return JSON.parse(localStorage.getItem('coach-profile')||'null'); } catch(e){return null;} })(),
            coachPersonality: localStorage.getItem('coach-personality'),
            summaryEmail: localStorage.getItem('summary-email'),
            summaryName: localStorage.getItem('summary-name'),
            summaryOptIn: localStorage.getItem('summary-optin'),
            coachCommitment: localStorage.getItem('coach-commitment'),
            coachId: localStorage.getItem('sea_coach_id'),
            archives: (() => { try { return JSON.parse(localStorage.getItem('sea-archives')||'[]'); } catch(e){return [];} })()
          };
          const payload = JSON.stringify({
            user_id: authUser.id,
            data: { ...data, _meta: meta },
            updated_at: new Date().toISOString()
          });
          // sendBeacon to a Netlify function that handles the Supabase write
          // Falls back to queued fetch if sendBeacon not available
          if (navigator.sendBeacon) {
            navigator.sendBeacon('/.netlify/functions/beacon-save', payload);
          }
        } catch(e){}
      };
      window.addEventListener('beforeunload', handleUnload);
      return () => window.removeEventListener('beforeunload', handleUnload);
    },[data, authUser]);

    const archiveAndReset = (reflection) => {

        reflection,
        data: JSON.parse(JSON.stringify(data))

      const archives = JSON.parse(localStorage.getItem('sea-archives')||'[]');
      archives.push(archive);
      localStorage.setItem('sea-archives', JSON.stringify(archives));
      localStorage.setItem('sea-cycle-number', String(archive.cycleNumber + 1));

      // Reset to fresh state, keeping profile settings
      const newStartDate = new Date().toISOString().split('T')[0];

        yearTheme: reflection.nextTheme || '',
        vision3Year: data.vision3Year,
        vision1Year: '',
        vision120Day: reflection.nextVision || '',
        goals: [{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''}],

      setWeekNum(1);

      setResetReflection({wins:'',lessons:'',proud:'',nextTheme:'',nextVision:'',nextAnvil:''});

    const updateField = (path,value)=>{

        const n=JSON.parse(JSON.stringify(prev));
        if(typeof path==='string'&&!path.includes('.')){n[path]=value;return n;}
        const keys=path.split('.');let cur=n;
        for(let i=0;i<keys.length-1;i++)cur=cur[keys[i]];
        cur[keys[keys.length-1]]=value;
        return n;
      });
    };

    const printTab = () => {

    const getAnvilStreak = () => {
      const log = data.anvilProject?.log || [];
      if (!log.length) return 0;
      const now = new Date(); now.setHours(0,0,0,0);
      const unique = [...new Set(log.map(e=>{const d=new Date(e.date);d.setHours(0,0,0,0);return d.toDateString();}))]
        .map(s=>new Date(s)).sort((a,b)=>b-a);
      let streak = 0;
      for (let i=0;i<unique.length;i++){const exp=new Date(now);exp.setDate(now.getDate()-i);if(unique[i].toDateString()===exp.toDateString())streak++;else break;}
      return streak;
    };

  const JournalView = ({ data, updateField }) => {
    const [newNote, setNewNote] = useState('');
    const [noteTitle, setNoteTitle] = useState('');
    const [noteTag, setNoteTag] = useState('Personal');
    const [filter, setFilter] = useState('All');
    const [search, setSearch] = useState('');
    const [editNote, setEditNote] = useState(null); // {id, title, content, tag}
    const TAG_COLORS = {Business:'bg-blue-900/50 text-blue-300',Personal:'bg-purple-900/50 text-purple-300',Ideas:'bg-yellow-900/50 text-yellow-300',Goals:'bg-green-900/50 text-green-300',Reflection:'bg-indigo-900/50 text-indigo-300',Daily:'bg-slate-700 text-slate-300'};
    const TAG_BORDER = {Business:'#3b82f6',Personal:'#a855f7',Ideas:'#f59e0b',Goals:'#10b981',Reflection:'#6366f1',Daily:'#475569'};
    const notes = data.notes || [];
    const TAGS = ['Business','Personal','Ideas','Goals','Reflection'];

    const buildFeed = () => {
      const entries = [...notes.map(n=>({...n, source:'note'}))];
      (data.dailyPlans||[]).forEach((week, wi) => {
        (week||[]).forEach((day, di) => {
          if (!day) return;
          const dayDate = (() => {
            if (!data.startDate) return null;
            const [y,m,d] = data.startDate.split('-').map(Number);
            const start = new Date(y,m-1,d);
            const dow = start.getDay();
            if (dow!==1){const adj=dow===0?1:8-dow;start.setDate(start.getDate()+adj);}
            const d2 = new Date(start);
            d2.setDate(d2.getDate() + wi*7 + di);
            return d2.toISOString();
          })();
          if (day.reflection?.trim()) entries.push({id:`ref-${wi}-${di}`,title:'💭 Daily Reflection',content:day.reflection.trim(),tag:'Reflection',date:dayDate||new Date().toISOString(),readOnly:true});
          if (day.notes?.trim()) entries.push({id:`note-${wi}-${di}`,title:'📅 Daily Note',content:day.notes.trim(),tag:'Daily',date:dayDate||new Date().toISOString(),readOnly:true});
        });
      });
      return entries.sort((a,b) => new Date(b.date) - new Date(a.date));

    const saveNew = () => {
      if (!newNote.trim()) return;

              <p className="text-xs mt-1">{filter==='All'?'Write your first note above, or answer the daily reflection on the Today tab':''}</p>
            </div>
          )}
        </div>

        {/* Edit Modal */}
        {editNote && (
          <div className="fixed inset-0 z-50 flex flex-col items-center justify-end md:justify-center px-0 md:px-5" style={{backgroundColor:'rgba(0,0,0,0.85)',backdropFilter:'blur(6px)'}} onClick={()=>setEditNote(null)}>

  // ── CoachMessageBox — pure vanilla JS textarea, React never touches it after mount ──
  const CoachMessageBox = ({ advisorId, coachId, coachName }) => {
    const wrapRef = useRef(null);
    useEffect(() => {
      const wrap = wrapRef.current;
      if (!wrap) return;
      // Build textarea and button purely in vanilla JS — immune to React re-renders
      const ta = document.createElement('textarea');
      ta.placeholder = 'Write a coaching message...';
      ta.rows = 2;
      ta.style.cssText = 'flex:1;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#f8fafc;font-size:16px;resize:none;font-family:inherit;min-width:0;width:100%;';
      const btn = document.createElement('button');
      btn.textContent = 'Send';
      btn.disabled = true;
      btn.style.cssText = 'padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:13px;align-self:stretch;min-width:70px;background:#1e293b;color:#475569;transition:all 0.2s;flex-shrink:0;';
      ta.addEventListener('input', () => {
        const has = !!ta.value.trim();
        btn.disabled = !has;
        btn.style.background = has ? '#6366f1' : '#1e293b';
        btn.style.color = has ? 'white' : '#475569';
      });
      btn.addEventListener('click', async () => {
        const msg = ta.value.trim();
        if (!msg || btn.disabled) return;
        btn.disabled = true; btn.textContent = '...';
        try {
          const res = await fetch('/.netlify/functions/coach?action=send-message', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ advisorId, coachId, coachName: coachName||'Your Coach', message: msg })
          });
          const d = await res.json();
          if (d.success) {
            ta.value = ''; ta.dispatchEvent(new Event('input'));
            btn.textContent = '✓ Sent'; btn.style.background = '#22c55e'; btn.style.color = 'white';
            setTimeout(() => { btn.textContent = 'Send'; btn.style.background = '#1e293b'; btn.style.color = '#475569'; btn.disabled = true; }, 2500);
            return;
          }
        } catch(e) { alert('Failed to send. Please try again.'); }
        btn.disabled = !ta.value.trim(); btn.textContent = 'Send';
      });
      wrap.appendChild(ta);

    // ── Coach sub-components (defined at module level to prevent remount on keypress) ──
  const CoachScoreRing = ({ score }) => {
    const pct = Math.min(100, Math.max(0, score||0));
    const r=28, cx=32, cy=32, circ=2*Math.PI*r, dash=(pct/100)*circ;
    const color = pct>=80?'#22c55e':pct>=50?'#f59e0b':'#ef4444';
    return (
      <svg width="64" height="64" viewBox="0 0 64 64" style={{flexShrink:0}}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#1e293b" strokeWidth="6"/>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth="6"
          strokeDasharray={`${dash} ${circ-dash}`} strokeLinecap="round"
          transform="rotate(-90 32 32)" style={{transition:'stroke-dasharray 0.5s'}}/>
        <text x="32" y="37" textAnchor="middle" fill={color} fontSize="13" fontWeight="bold">{Math.round(pct)}</text>
      </svg>
    );
  };

      <div style={{display:'flex',flexDirection:'column',gap:'5px'}}>

          const pct = g.target>0 ? Math.min(100,(g.current/g.target)*100) : (g.completion||0);

            <div key={i}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:'11px',color:'#94a3b8',marginBottom:'2px'}}>

              </div>
              <div style={{height:'4px',background:'#1e293b',borderRadius:'2px'}}>

      }

          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` } }

      } catch(e) { setError(e.message); }

        const token = session?.data?.session?.access_token;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${userId}`, {

          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${token}`,

      } catch(e) { setError(e.message); }

          </div>
          <button onClick={fetchUsers} style={{ background: '#1e293b', border: '1px solid #334155', borderRadius: '8px', padding: '7px 14px', color: '#94a3b8', cursor: 'pointer', fontSize: '12px' }}>
            ↻ Refresh
          </button>
        </div>

        {/* Invite a Coach */}

              onChange={e => setCoachInviteEmail(e.target.value)}

            />
            <button

              disabled={coachInviteStatus === 'sending'}
              style={{ padding: '9px 18px', borderRadius: '8px', background: coachInviteStatus === 'sent' ? '#10b981' : '#6366f1', color: 'white', border: 'none', cursor: 'pointer', fontSize: '13px', fontWeight: '700', whiteSpace: 'nowrap' }}
            >
              {coachInviteStatus === 'sending' ? 'Sending…' : coachInviteStatus === 'sent' ? '✓ Invite Sent!' : 'Send Coach Invite'}

          {coachInviteStatus === 'error' && <p style={{ color: '#f87171', fontSize: '12px', margin: '8px 0 0' }}>{coachInviteError}</p>}

          <div style={{ textAlign: 'center', padding: '40px', color: '#64748b' }}>Loading users…</div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>

                </div>
                {/* Info */}
                <div style={{ flex: 1, minWidth: '120px' }}>

  const CoachMessageModal = ({ advisorId, advisorName, coachId, coachName, onClose }) => {

          method: 'POST', headers: {'Content-Type':'application/json'},

        });

                    <span style={{color:'#64748b',fontSize:'13px'}}>{inbox.length} message{inbox.length!==1?'s':''} from clients</span>
                    <button onClick={fetchInbox} style={{background:'#1e293b',color:'#94a3b8',border:'1px solid #334155',borderRadius:'8px',padding:'6px 14px',cursor:'pointer',fontSize:'12px'}}>🔄 Refresh</button>
                  </div>
                  {inbox.map(msg=>{
                    const fmt = ts => { const d=new Date(ts),now=new Date(); return (now-d)<86400000?d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
                    return (

                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px'}}>

  // Two-way coach messaging — client sees conversation thread + can reply
  const CoachMessages = ({ advisorId, coachId, advisorName }) => {
    const [messages, setMessages] = useState([]);
    const [loading, setLoading] = useState(false);
    const [open, setOpen] = useState(false);
    const [unread, setUnread] = useState(0);
    const [replyText, setReplyText] = useState('');
    const [sending, setSending] = useState(false);
    const [sent, setSent] = useState(false);

    const fetchMessages = useCallback(async () => {
      if (!advisorId) return;
      setLoading(true);
      try {
        const res = await fetch(`${COACH_API}?action=get-messages&advisorId=${encodeURIComponent(advisorId)}`);
        const data = await res.json();
        if (Array.isArray(data)) {
          setMessages(data); // already asc by timestamp
          setUnread(data.filter(m=>!m.read && m.sender==='coach').length);
        }
      } catch(e) { /* silent */ }
      setLoading(false);
    }, [advisorId]);

    useEffect(() => {
      fetchMessages();
      const t = setInterval(fetchMessages, 3*60*1000);
      return () => clearInterval(t);
    }, [fetchMessages]);

    const markAllRead = async () => {
      if (unread===0) return;
      setUnread(0);
      setMessages(m=>m.map(msg=>({...msg,read:true})));
      fetch(`${COACH_API}?action=mark-read`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({advisorId})}).catch(()=>{});
    };

    const sendReply = async () => {
      const msg = replyText.trim();
      if (!msg || !coachId) return;
      setSending(true);
      try {
        await fetch(`${COACH_API}?action=send-reply`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ coachId, advisorId, advisorName: advisorName||'Advisor', message: msg }),
        });
        setReplyText('');
        setSent(true);
        setTimeout(()=>setSent(false), 3000);
        fetchMessages();
      } catch(e) { /* silent */ }
      setSending(false);
    };

    const toggle = () => { if (!open && unread>0) markAllRead(); setOpen(o=>!o); };
    const fmt = ts => { const d=new Date(ts),now=new Date(); return (now-d)<86400000?d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };

    return (
      <div className={`bg-slate-800/60 rounded-2xl border overflow-hidden ${unread>0?'border-purple-500/50':'border-slate-700'}`} style={{transition:'border-color 0.3s'}}>
        <button onClick={toggle} className="w-full p-4 flex items-center justify-between text-left" style={{background:'transparent',border:'none',cursor:'pointer',color:'#f8fafc'}}>
          <div className="flex items-center gap-3">
            <span className="text-2xl">💬</span>
            <div>
              <p className="font-bold text-white text-sm">Coach Messages</p>
              <p className="text-xs text-slate-400 mt-0.5">{loading?'Checking...':(messages.length===0?'No messages yet':`${messages.length} message${messages.length!==1?'s':''}`)}</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {unread>0&&<span className="bg-purple-600 text-white text-xs font-bold rounded-full px-2 py-0.5">{unread} new</span>}
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{transform:open?'rotate(180deg)':'rotate(0deg)',transition:'transform 0.2s',color:'#64748b'}}><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </button>
        {open && (
          <div className="border-t border-slate-700 p-4 space-y-3">
            {/* Message thread */}
            {messages.length===0 ? (
              <div className="text-center py-6 text-slate-500">
                <div className="text-3xl mb-2">📭</div>
                <p className="text-sm">No messages yet. Send your coach an update below.</p>
              </div>
            ) : messages.map(msg => {
              const isMe = msg.sender === 'advisor';
              return (
                <div key={msg.id||msg.timestamp} style={{display:'flex',flexDirection:'column',alignItems:isMe?'flex-end':'flex-start'}}>
                  <div style={{maxWidth:'85%',borderRadius:isMe?'16px 16px 4px 16px':'16px 16px 16px 4px',padding:'10px 14px',background:isMe?'rgba(99,102,241,0.25)':'rgba(255,255,255,0.06)',border:`1px solid ${isMe?'rgba(99,102,241,0.4)':'rgba(255,255,255,0.08)'}`}}>
                    <p style={{fontSize:'11px',fontWeight:'700',color:isMe?'#a78bfa':'#60a5fa',marginBottom:'4px'}}>{isMe?'You':(msg.coach_name||'Coach')}</p>
                    <p style={{fontSize:'13px',color:'#e2e8f0',lineHeight:'1.5',margin:0}}>{msg.message}</p>
                  </div>
                  <span style={{fontSize:'10px',color:'#475569',marginTop:'3px',paddingLeft:'4px',paddingRight:'4px'}}>{fmt(msg.timestamp)}</span>
                </div>
              );
            })}

            {/* Reply box — only show if connected to a coach */}
            {coachId && (
              <div style={{marginTop:'8px',borderTop:'1px solid #1e293b',paddingTop:'12px'}}>
                <textarea
                  value={replyText}
                  onChange={e=>setReplyText(e.target.value)}
                  placeholder="Send a message to your coach..."
                  rows={2}
                  style={{width:'100%',background:'rgba(15,23,42,0.8)',border:'1px solid #334155',borderRadius:'10px',padding:'10px 12px',color:'#f8fafc',fontSize:'13px',resize:'vertical',boxSizing:'border-box',fontFamily:'inherit'}}
                  onKeyDown={e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))sendReply();}}
                />
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'8px'}}>
                  <span style={{fontSize:'11px',color:'#475569'}}>⌘+Enter to send</span>
                  <button onClick={sendReply} disabled={sending||!replyText.trim()}
                    style={{padding:'8px 18px',borderRadius:'8px',border:'none',cursor:sending||!replyText.trim()?'not-allowed':'pointer',opacity:sending||!replyText.trim()?0.5:1,background:'#6366f1',color:'white',fontSize:'12px',fontWeight:'700'}}>
                    {sending?'Sending...':sent?'✓ Sent!':'Send'}
                  </button>
                </div>
              </div>
            )}
            <button onClick={fetchMessages} style={{width:'100%',padding:'8px',fontSize:'11px',color:'#475569',background:'transparent',border:'1px solid #1e293b',borderRadius:'10px',cursor:'pointer',marginTop:'4px'}}>🔄 Refresh</button>
          </div>
        )}
      </div>
    );
  };

  // ── APP ROOT ───────────────────────────────────────────────────────────────
  // Renders only when user is authenticated — all hooks are safe here
  // ── SUBSCRIPTION PAYWALL ─────────────────────────────────────────────────
  const SubscribeScreen = ({ authUser, onSubscribed }) => {
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');

    const handleSubscribe = async () => {
      setLoading(true); setError('');
      try {
        const res = await fetch('/.netlify/functions/stripe-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: authUser.id, email: authUser.email }),
        });
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          setError(data.error || 'Something went wrong. Please try again.');
        }
      } catch(e) {
        setError('Connection error. Please try again.');
      } finally {
        setLoading(false);
      }
    };

    return (
      <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#0f1229 0%,#1a1f4e 100%)',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px'}}>
        <div style={{maxWidth:'480px',width:'100%',textAlign:'center'}}>
          <div style={{fontSize:'3rem',marginBottom:'16px'}}>🎯</div>
          <h1 style={{color:'white',fontSize:'2rem',fontWeight:'800',marginBottom:'8px',letterSpacing:'-0.02em'}}>S.E.A. Dashboard</h1>
          <p style={{color:'#94a3b8',fontSize:'1rem',marginBottom:'40px'}}>Strategic · Executable · Accountable</p>

          <div style={{background:'rgba(255,255,255,0.05)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:'20px',padding:'32px',marginBottom:'24px'}}>
            <div style={{color:'#60a5fa',fontSize:'0.85rem',fontWeight:'700',letterSpacing:'0.1em',marginBottom:'8px',textTransform:'uppercase'}}>Monthly Subscription</div>
            <div style={{color:'white',fontSize:'3rem',fontWeight:'800',marginBottom:'4px'}}>$97<span style={{fontSize:'1rem',color:'#94a3b8',fontWeight:'400'}}>/mo</span></div>
            <div style={{color:'#64748b',fontSize:'0.85rem',marginBottom:'28px'}}>Cancel anytime</div>

            <div style={{textAlign:'left',marginBottom:'28px'}}>
              {['AI-powered accountability coach','Daily, weekly & 120-day planner','Goal tracking & Wheel of John','Interactive Coach Dashboard','Weekly performance summaries'].map(f=>(
                <div key={f} style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'}}>
                  <span style={{color:'#10b981',fontSize:'1rem'}}>✓</span>
                  <span style={{color:'#cbd5e1',fontSize:'0.9rem'}}>{f}</span>
                </div>
              ))}
            </div>

            <button onClick={handleSubscribe} disabled={loading}
              style={{width:'100%',padding:'16px',borderRadius:'14px',border:'none',cursor:loading?'not-allowed':'pointer',opacity:loading?0.7:1,fontSize:'1rem',fontWeight:'700',color:'white',background:'linear-gradient(135deg,#3b82f6,#6366f1)',boxShadow:'0 4px 20px rgba(99,102,241,0.4)'}}>
              {loading ? 'Redirecting to checkout...' : 'Subscribe & Get Access'}
            </button>

            {error && <p style={{color:'#f87171',fontSize:'0.85rem',marginTop:'12px'}}>{error}</p>}
          </div>

          <p style={{color:'#475569',fontSize:'0.8rem'}}>Signed in as {authUser.email} · <button onClick={async()=>{await _supabase.auth.signOut();window.location.reload();}} style={{background:'none',border:'none',color:'#64748b',cursor:'pointer',textDecoration:'underline',fontSize:'0.8rem'}}>Sign out</button></p>
        </div>
      </div>
    );
  };

  const AuthenticatedApp = ({ authUser, setAuthUser }) => {
    const [onboardingDone, setOnboardingDone] = useState(false);
    const [onboardingData, setOnboardingData] = useState(null);
    const [showingOnboarding, setShowingOnboarding] = useState(false);
    const [subStatus, setSubStatus] = useState(null);
    const [showReEngageBanner, setShowReEngageBanner] = useState(false);

    // Show re-engagement banner if last_seen stored locally is > 24h ago
    useEffect(() => {
      const lastSeen = localStorage.getItem('sea_last_seen');
      if (lastSeen) {
        const diff = Date.now() - new Date(lastSeen).getTime();
        if (diff > 24 * 60 * 60 * 1000) setShowReEngageBanner(true);
      }
      // Always update local last_seen on mount
      localStorage.setItem('sea_last_seen', new Date().toISOString());
    }, []);
    const BYPASS_EMAIL = 'gino.coppola@gettingresultsinc.com'; // owner always has access

    // Check subscription status on mount
    useEffect(() => {
      // PAYWALL DISABLED — set to true to enable billing enforcement
      const PAYWALL_ENABLED = false;
      if (!PAYWALL_ENABLED) { setSubStatus('active'); return; }

      // Owner bypass — always grant access
      if (authUser.email === BYPASS_EMAIL) { setSubStatus('active'); return; }

      // Check URL params — returning from successful Stripe checkout
      const params = new URLSearchParams(window.location.search);
      if (params.get('subscribed') === 'true') {
        // Give webhook a moment to update Supabase, then check
        setTimeout(async () => {
          await checkSub();
          window.history.replaceState({}, '', window.location.pathname);
        }, 2000);
        return;
      }

      checkSub();
    }, [authUser]);

    const checkSub = async () => {
      try {
        const session = await _supabase.auth.getSession();
        const token = session.data.session?.access_token;
        if (!token) { setSubStatus('inactive'); return; }
        const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${authUser.id}&select=subscription_status`, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${token}` }
        });
        const rows = await res.json();
        const status = rows?.[0]?.subscription_status;
        setSubStatus(status === 'active' ? 'active' : 'inactive');
      } catch(e) {
        console.error('sub check error:', e);
        setSubStatus('active'); // fail open — never lock out on network error
      }
    };
    const hasData = ()=>{try{const s=localStorage.getItem('sea-planner-data');if(!s)return false;const p=JSON.parse(s);return!!(p.slightEdge||p.goals?.some(g=>g.title));}catch(e){return false;}};
    const [showOnboarding] = useState(()=>!hasData());
    const getExistingData = () => {
      try {
        const s = localStorage.getItem('sea-planner-data');
        const p = s ? JSON.parse(s) : {};
        const pers = localStorage.getItem('coach-personality');
        return {
          slightEdge: p.slightEdge||'', yearTheme: p.yearTheme||'',
          vision120Day: p.vision120Day||'', startDate: p.startDate||'',
          goals: p.goals||[{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''}],
          wheelOfJohn: p.weeks?.[0]?.wheelOfJohn||{family:5,fun:5,fitness:5,finance:5,faith:5},
          anvil: p.anvilProject ? {project:p.anvilProject.project||'',cadence:p.anvilProject.cadence||'',why:p.anvilProject.why||''} : {project:'',cadence:'',why:''},
          personality: pers ? JSON.parse(pers) : {style:2,tone:2,approach:2,energy:2},
          coachProfile: (() => { try { const s=localStorage.getItem('coach-profile'); return s?JSON.parse(s):{years:'',production:'',need:'',obstacle:'',style:'',why:'',drift:'',family:'',niche:'',fear:'',successDef:'',avoiding:'',proud:'',fiveYear:'',holdingBack:''}; } catch(e) { return {years:'',production:'',need:'',obstacle:'',style:'',why:'',drift:'',family:'',niche:'',fear:'',successDef:'',avoiding:'',proud:'',fiveYear:'',holdingBack:''}; } })()
        };
      } catch(e) { return {slightEdge:'',yearTheme:'',vision120Day:'',startDate:'',goals:[{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''},{title:'',impact:'',measurement:''}],anvil:{project:'',cadence:'',why:''},personality:{style:2,tone:2,approach:2,energy:2}}; }
    };
    const handleOnboardingComplete = (d) => { setOnboardingData(d); setOnboardingDone(true); setShowingOnboarding(false); };
    const handleReopenOnboarding = () => setShowingOnboarding(true);

    // Subscription gate — if check fails, default to showing app (fail open) so blank screens never happen
    if (subStatus === null) return React.createElement('div', { style: { display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', background:'#0f1229', color:'white', fontSize:'1.2rem' } }, 'Loading...');
    if (subStatus === 'inactive') return <SubscribeScreen authUser={authUser} onSubscribed={()=>setSubStatus('active')}/>;

    if ((showOnboarding && !onboardingDone) || showingOnboarding) {
      return <OnboardingFlow onComplete={handleOnboardingComplete} initialData={getExistingData()}/>;
    }
    return (
      <>
        {showReEngageBanner && (
          <div style={{
            position: 'fixed', top: 0, left: 0, right: 0, zIndex: 9999,
            background: 'linear-gradient(135deg,#6366f1,#8b5cf6)',
            padding: '12px 20px',
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            boxShadow: '0 2px 12px rgba(99,102,241,0.4)',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
              <span style={{ fontSize: '1.2rem' }}>👋</span>
              <span style={{ color: 'white', fontWeight: 600, fontSize: '0.9rem' }}>
                Welcome back! Keep your Slight Edge going — log today's progress.
              </span>
            </div>
            <button
              onClick={() => setShowReEngageBanner(false)}
              style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.8)', cursor: 'pointer', fontSize: '1.2rem', padding: '0 4px', lineHeight: 1 }}
              aria-label="Dismiss"
            >×</button>
          </div>
        )}
        <div style={showReEngageBanner ? { paddingTop: '48px' } : {}}>
          <SEAPlannerApp onboardingData={onboardingData} onReopenOnboarding={handleReopenOnboarding} authUser={authUser} setAuthUser={setAuthUser}/>
        </div>
      </>
    );
  };

  // Error Boundary — catches runtime errors and shows a recovery screen instead of blank
  class ErrorBoundary extends React.Component {
    constructor(props) {
      super(props);
      this.state = { hasError: false, error: null };
    }
    static getDerivedStateFromError(error) {
      return { hasError: true, error };
    }
    componentDidCatch(error, info) {
      console.error('[SEA] Uncaught error:', error, info);
    }
    render() {
      if (this.state.hasError) {
        return React.createElement('div', {
          style: {
            display: 'flex', flexDirection: 'column', alignItems: 'center',
            justifyContent: 'center', height: '100vh',
            background: '#0f1229', color: 'white',
            fontFamily: 'sans-serif', textAlign: 'center', padding: '2rem'
          }
        },
          React.createElement('div', { style: { fontSize: '3rem', marginBottom: '1rem' } }, '⚠️'),
          React.createElement('h2', { style: { fontSize: '1.4rem', marginBottom: '0.5rem', color: '#f87171' } }, 'Something went wrong'),
          React.createElement('p', { style: { color: '#94a3b8', marginBottom: '2rem', maxWidth: '320px' } },
            'An unexpected error occurred. Your data is safe — tap below to reload.'
          ),
          React.createElement('button', {
            onClick: () => window.location.reload(),
            style: {
              background: 'linear-gradient(135deg,#6366f1,#8b5cf6)',
              color: 'white', border: 'none', borderRadius: '12px',
              padding: '0.75rem 2rem', fontSize: '1rem', cursor: 'pointer',
              fontWeight: '600'
            }
          }, 'Reload App')
        );
      }
      return this.props.children;
    }
  }

  // Top-level router + auth gate — hooks called unconditionally
  const AppRoot = () => {
    const [authUser, setAuthUser] = useState(null);
    const [authLoading, setAuthLoading] = useState(true);
    const [needsPasswordReset, setNeedsPasswordReset] = useState(false);
    const [needsSetPassword, setNeedsSetPassword] = useState(false);

    useEffect(() => {
      _supabase.auth.getSession().then(({ data: { session } }) => {
        setAuthUser(session?.user ?? null);
        setAuthLoading(false);
      });
      const { data: { subscription } } = _supabase.auth.onAuthStateChange((_event, session) => {
        // PASSWORD_RECOVERY: user clicked reset link — keep them on AuthRouter reset screen
        if (_event === 'PASSWORD_RECOVERY') {
          setNeedsPasswordReset(true);
          setAuthUser(session?.user ?? null);
          setAuthLoading(false);
          return;
        }
        // USER_UPDATED: password was just changed — clear reset flag and let them in
        if (_event === 'USER_UPDATED') {
          setNeedsPasswordReset(false);
          setNeedsSetPassword(false);
        }
        // SIGNED_IN via magic link (invite) — new users must set a password before entering
        if (_event === 'SIGNED_IN') {
          const isInviteFlow = new URLSearchParams(window.location.search).get('invite') === '1'
            || localStorage.getItem('sea_invite_flow') === '1';
          if (isInviteFlow) {
            localStorage.removeItem('sea_invite_flow');
            setNeedsSetPassword(true);
            setAuthUser(session?.user ?? null);
            setAuthLoading(false);
            return;
          }
        }
        setAuthUser(session?.user ?? null);
        setAuthLoading(false);
        // Update last_seen on every login / session refresh
        if (session?.user) {
          fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${session.user.id}`, {
            method: 'PATCH',
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': `Bearer ${session.access_token}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal',
            },
            body: JSON.stringify({ last_seen: new Date().toISOString() }),
          }).catch(() => {});
        }
      });
      return () => subscription.unsubscribe();
    }, []);

    // Check for share link
    const urlParams = new URLSearchParams(window.location.search);
    const shareParam = urlParams.get('share');
    if (shareParam) {
      try {
        const padded = shareParam.replace(/-/g,'+').replace(/_/g,'/');
        const shareData = JSON.parse(decodeURIComponent(escape(atob(padded))));
        return <ShareView shareData={shareData}/>;
      } catch(e) {}
    }

    // ?set_password=1 — new user clicked magic link from invite flow
    // ?reset_password=1 — existing user clicked password reset email
    // Both: preserve hash so AuthRouter sees the token, then show the right screen
    const isSetPassword = urlParams.get('set_password') === '1';
    const isResetPassword = urlParams.get('reset_password') === '1';
    if (isSetPassword || isResetPassword) {
      if (isSetPassword) localStorage.setItem('sea_invite_flow', '1');
      // Preserve hash, clear query string
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, '', window.location.pathname + window.location.hash);
      }
      if (!authUser) return React.createElement(AuthRouter, {
        needsPasswordReset: isResetPassword, onResetDone: () => setNeedsPasswordReset(false),
        needsSetPassword: false, onSetPasswordDone: () => setNeedsSetPassword(false),
        startOnSignup: false,
      });
    }

    // Check for coach dashboard param
    const coachParam = urlParams.get('coach');
    const isInviteLink = urlParams.get('invite') === '1';
    if (coachParam) {
      // Save coach ID immediately (always overwrite stale anonymous values)
      if (!coachParam.startsWith('adv_')) {
        localStorage.setItem('sea_coach_id', coachParam);
      }
      // If it's a client invite link (not a coach viewing their own dashboard)
      if (isInviteLink) {
        // Flag for invite flow so set-password screen shows after sign-in
        localStorage.setItem('sea_invite_flow', '1');
        // Clear URL now — AuthRouter will use localStorage flags
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, '', window.location.pathname);
        }
        // Show AuthRouter in invite/signup mode
        if (!authUser) return React.createElement(AuthRouter, {
          needsPasswordReset: false, onResetDone: () => {},
          needsSetPassword: false, onSetPasswordDone: () => setNeedsSetPassword(false),
          startOnSignup: true,
        });
      } else {
        // Non-invite coach param: if logged in show coach dashboard, else just save and clear
        if (authUser) return <CoachDashboard coachId={coachParam}/>;
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, '', window.location.pathname);
        }
      }
    }

    if (authLoading) return React.createElement('div', { style: { display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', background:'#0f1229', color:'white', fontSize:'1.2rem' } }, 'Loading...');
    // Password reset flow: show reset screen even if already signed in
    if (needsPasswordReset) return React.createElement(AuthRouter, { needsPasswordReset: true, onResetDone: () => setNeedsPasswordReset(false) });
    // Invite set-password flow: new user must set a password before entering app
    if (needsSetPassword) return React.createElement(AuthRouter, { needsSetPassword: true, onSetPasswordDone: () => setNeedsSetPassword(false) });
    if (!authUser) return React.createElement(AuthRouter, { needsPasswordReset: false, onResetDone: () => setNeedsPasswordReset(false) });
    return React.createElement(AuthenticatedApp, { authUser, setAuthUser });
  };

  ReactDOM.render(
    React.createElement(ErrorBoundary, null, React.createElement(AppRoot, null)),
    document.getElementById('root')
  );

  // Register service worker for push notifications
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js')
        .then(function(reg) {
          console.log('SEA Service Worker registered:', reg.scope);
        })
        .catch(function(err) {
          console.error('SEA Service Worker registration failed:', err);
        });
    });
  }
</script>
</body>
</html>
